      - name: V9.0 - Identify missing vertex shader hash candidates by ENGINE signature, no aliases installed
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v90_alias_diagnostics.py <<'PY_SN512A_V90'
          from pathlib import Path
          import hashlib, json, os
          shader = Path('crates/glue5-gpu/src/shader.rs')
          exec_rs = Path('crates/glue5-gpu/src/exec.rs')
          draw = Path('crates/glue5-gpu/src/draw.rs')
          docs = Path('crates/glue5/src/sn512a_public_docs.rs')
          def one(f, before, after, name):
              if name == 'create-shader read-only signature+candidate log':
                  before = before.split('\n')[0] + '\n' + '\n'.join('    ' + line for line in before.split('\n')[1:])
                  after = after.split('\n')[0] + '\n' + '\n'.join('    ' + line for line in after.split('\n')[1:])
