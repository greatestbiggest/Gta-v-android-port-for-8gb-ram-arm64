                              live.insert(tid);
                              let Ok(name)=fs::read_to_string(entry.path().join("comm")) else {continue};
                              let mask=target(&name,&plan);
                              if mask==0 {continue}
                              let short_name=name.trim().to_string();
                              if seen.get(&tid).map(|(old,m)|old==&short_name&&*m==mask).unwrap_or(false) {continue}
                              let result=apply(tid,mask);
                              let label=match &result {Ok(())=>"applied".into(),Err(e)=>format!("rejected: {}",e)};
