          if mode == 'yes':
              replace_once('''const PRESENT_WGSL: &str = "@group(0) @binding(0) var src: texture_2d<f32>;
          @group(0) @binding(1) var smp: sampler;
          @fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(bicubic(src, v.uv), 1.0); }";''',
              '''const PRESENT_WGSL: &str = "@group(0) @binding(0) var src: texture_2d<f32>;
          @group(0) @binding(1) var smp: sampler;
          @fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(bicubic(src, v.uv), 1.0); }";
          // SN512A V9.8 NATIVE_PRESENT_FASTPATH: no resampling is necessary at exact 1:1.
          // One filtered texel-center lookup instead of the original five bicubic lookups.
          // No resolution reduction or sharpening: native pixels remain native pixels.
          const PRESENT_NATIVE_WGSL: &str = "@group(0) @binding(0) var src: texture_2d<f32>;
          @group(0) @binding(1) var smp: sampler;
          @fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(textureSampleLevel(src, smp, v.uv, 0.0).rgb, 1.0); }";''',
              'insert native passthrough shader')
          
              replace_once('''    blit: Option<(wgpu::RenderPipeline, wgpu::Sampler)>,
              composite: Option<(wgpu::RenderPipeline, wgpu::Sampler)>,''',
              '''    blit: Option<(wgpu::RenderPipeline, wgpu::Sampler)>,
              // SN512A V9.8: cache separate 1:1 pipeline; keep existing bicubic one.
              native_blit: Option<(wgpu::RenderPipeline, wgpu::Sampler)>,
              composite: Option<(wgpu::RenderPipeline, wgpu::Sampler)>,''',
              'store native blit pipeline')
          
              replace_once('''        rect: (u32, u32, u32, u32),
              ) {
                  self.for_format(format);
                  let (pipeline, sampler) = match &self.blit {
                      Some(b) => b.clone(),
                      None => {
                          let Some(pipeline) = present_pipeline(device, "present", PRESENT_WGSL, format) else { return };
                          self.blit.insert((pipeline, linear_sampler(device))).clone()
                      }
                  };''',
              '''        rect: (u32, u32, u32, u32),
                  native: bool,
              ) {
                  self.for_format(format);
                  // SN512A V9.8: use 1-tap passthrough only for exact source=destination
                  // pixel dimensions. Other sizes retain the stock five-tap bicubic.
                  let pipeline_slot = if native { &mut self.native_blit } else { &mut self.blit };
                  let (pipeline, sampler) = match pipeline_slot {
                      Some(b) => b.clone(),
                      None => {
                          let (label, shader) = if native {
                              ("present-native-1to1", PRESENT_NATIVE_WGSL)
                          } else {
                              ("present", PRESENT_WGSL)
                          };
                          let Some(pipeline) = present_pipeline(device, label, shader, format) else { return };
                          pipeline_slot.insert((pipeline, linear_sampler(device))).clone()
                      }
                  };''',
              'branch blit pipeline with correct pass lifetime')
          
              replace_once('''Some(Scaled::Frame(view)) => self.passes.blit(device, &mut pass, view, format, rect),''',
                           '''Some(Scaled::Frame(view)) => self.passes.blit(device, &mut pass, view, format, rect, false),''',
                           'leave temporally scaled frame path alone')
          
              replace_once('''None => self.passes.blit(device, &mut pass, &p.view, format, rect),''',
                           '''None => self.passes.blit(device, &mut pass, &p.view, format, rect,
                               p.width == rect.2 && p.height == rect.3),''',
                           'choose native only at source/destination 1:1')
          
              replace_once('''for fs in [super::PRESENT_WGSL, super::COMPOSITE_WGSL] {''',
                           '''for fs in [super::PRESENT_WGSL, super::PRESENT_NATIVE_WGSL, super::COMPOSITE_WGSL] {''',
                           'check Naga shader parser and validator in upstream tests')
          
              p.write_text(src)
          
          assert src.count('self.passes.blit(')==2, 'unexpected additional blit site'
          assert 'const PRESENT_WGSL' in src and 'const COMPOSITE_WGSL' in src
          assert 'native_blit' in src if mode=='yes' else 'native_blit' not in src
          report = {
              'version':'SN512A GLUE5 V9.8 R1',
              'base':'V9.7 R1 patches / V9.6 R2 pause-menu map visual fix',
              'native_present_fastpath':mode,
              'native_output_resolution_preserved':True,
              'renderer_change':'1:1 back buffer uses 1 texture lookup instead of 5 bicubic lookups' if mode=='yes' else 'unmodified stock 5-tap bicubic',
              'other_scaling':'stock 5-tap bicubic, unchanged',
              'game_engine_render_passes':'unchanged',
              'GPU_time_reduction':'unmeasured; present-blit optimization alone unlikely to eliminate 88ms bottleneck',
              'existing_work_invariants':'All prior GPU synchronization, draw caches, map/alpha guard, upload worker, shader aliases untouched',
              'source_present_sha256_before':original_sha,
              'source_present_sha256_after':hashlib.sha256(src.encode()).hexdigest(),
