          }
          
          fn apply(tid: i32, cores: u16) -> Result<(), std::io::Error> {
              // linux kernel affinity is a bitset of logical CPU IDs. Use standard 128-byte
              // CPU set for the syscall: 0..7 bits are configurable in this UI.
              let mut bits=[0u8;128];
              bits[0]=(cores&0xff) as u8;
              let status=unsafe { sched_setaffinity(tid,bits.len(),bits.as_ptr().cast::<c_void>()) };
              if status != 0 { return Err(std::io::Error::last_os_error()) }
              Ok(())
          }
          
          pub(crate) fn activate(main:u16,render:u16,submit:u16,encode:[u16;4],upload:[u16;4]) {
              let plan=Plan{main,render,submit,encode,upload};
              // All-Auto is zero extra work. Only one game can run in a process.
              let active=main | render | submit | encode.iter().copied().fold(0u16,|a,b|a|b)
                  | upload.iter().copied().fold(0u16,|a,b|a|b);
              if active==0 { return }
              if STARTED.swap(true,Ordering::SeqCst) { return }
              let _=std::thread::Builder::new().name("sn512a-affinity".into()).spawn(move||{
                  let log_dir=crate::paths::android_external_dir().map(|p| p.join("logs"));
                  if let Some(p)=log_dir.as_ref() { let _=fs::create_dir_all(p); }
                  let mut log=log_dir.as_ref().and_then(|p|File::create(p.join("thread-schedule.csv")).ok());
                  if let Some(f)=log.as_mut() {let _=f.write_all(b"tid,thread,requested_cpu_mask,result\n");}
                  let mut seen=HashMap::<i32,(String,u16)>::new();
                  // During startup new threads appear, so scan periodically. Each TID gets
