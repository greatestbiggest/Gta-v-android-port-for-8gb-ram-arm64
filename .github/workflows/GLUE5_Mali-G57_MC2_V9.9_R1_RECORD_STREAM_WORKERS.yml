          set -euo pipefail
          cat > /tmp/sn512a_v88_patch.py <<'PY_SN512A_V88'
          #!/usr/bin/env python3
          """V8.8: stable CPU draw-state tweaks and *exact-hash* missing shader recovery.

          Only restores WGSL files whose ORIGINAL 64-bit shader hash exists in a
          sibling build's index.json; never fabricates shader code, overwrites assets,
          or changes GPU parallelism or resource lifetime policy.
          """
          from pathlib import Path
          import os, hashlib, json

          CHANGES = []
          def replace_exact(file, old, new, label):
              p=Path(file); s=p.read_text(); n=s.count(old)
              if n!=1:
                  raise SystemExit(f'V8.8 abort: {label}: expected exactly one source anchor in {file}, got {n}')
              p.write_text(s.replace(old,new,1))
              CHANGES.append({'file':file, 'description':label})

          shader='crates/glue5-gpu/src/shader.rs'
          # Recover *real* pretranslated WGSL from user-owned sibling build directories.
          # A missing shader cannot be generated from its label or hash; never choose a
          # lookalike effect or lower workgroup size without understanding the algorithm.
          replace_exact(shader,
          '''struct Entry {
              label: String,
              ok: bool,
              consts: bool,
              error: Option<String>,
          }''',
          '''struct Entry {
              label: String,
              ok: bool,
              consts: bool,
              error: Option<String>,
              // SN512A V8.8: alternate *exact hash* WGSL source from a sibling pack.
              source_dir: Option<PathBuf>,
          }''',
          'shader Entry source provenance')
          replace_exact(shader,
          '''                    error: v.get("error").and_then(|x| x.as_str()).map(String::from),
                          },''',
          '''                    error: v.get("error").and_then(|x| x.as_str()).map(String::from),
                              source_dir: None,
                          },''',
          'initialize original shader entry source provenance')
          replace_exact(shader,
          '''        log::info!("gpu: {} translated shaders in {}", index.len(), dir.display());''',
          '''        // Read-only recovery: existing user-owned alternate packs with matching
                  // 64-bit shader hash+metadata can supply missing WGSL/constant tables.
                  // No network, no APK-embedded game files, no invented shader programs.
                  #[cfg(target_os = "android")]
                  sn512a_recover_exact_shaders(dir, &mut index);
                  log::info!("gpu: {} translated shaders in {}", index.len(), dir.display());''',
          'activate exact shader asset recovery before program initialization')
          replace_exact(shader,
          '''        let source = std::fs::read_to_string(self.dir.join(format!("{name}.wgsl")))?;''',
          '''        let source_root = entry.source_dir.as_deref().unwrap_or(&self.dir);
                  let source = std::fs::read_to_string(source_root.join(format!("{name}.wgsl")))?;''',
          'use recovered exact shader source where available')
          replace_exact(shader,
          '''            let json = std::fs::read_to_string(self.dir.join(format!("{name}.consts.json")))?;''',
          '''            let json = std::fs::read_to_string(source_root.join(format!("{name}.consts.json")))?;''',
          'use matching constants table from the same source')
          helper=r'''
          // SN512A V8.8: a shader translated for the same *bytecode hash* can be
          // shared between the user's OWN copies of build-specific translated packs.
          // Index labels must match if both packs have an entry. No shader substitutions
          // by just an effect name (bindings may be incompatible), no modifications to
          // game data, and no directory traversal outside the sibling `game/b/*` packs.
          #[cfg(target_os = "android")]
          fn sn512a_recover_exact_shaders(dir: &Path, index: &mut HashMap<u64, Entry>) {
              let Some(build_dir) = dir.parent() else { return; };
              let Some(b_root) = build_dir.parent() else { return; };
              if dir.file_name() != Some(std::ffi::OsStr::new("shaders"))
                  || b_root.file_name() != Some(std::ffi::OsStr::new("b")) {
                  return;
              }
              let mut recovered_file = 0usize;
              let mut recovered_index = 0usize;
              let mut checked = 0usize;
              let Ok(dirs) = std::fs::read_dir(b_root) else { return; };
              for alt_dir in dirs.filter_map(Result::ok).map(|e| e.path()).take(16) {
                  let alt = alt_dir.join("shaders");
                  if alt == dir || !alt.is_dir() { continue; }
                  let Ok(json_text) = std::fs::read_to_string(alt.join("index.json")) else { continue; };
                  let Ok(json) = serde_json::from_str::<serde_json::Value>(&json_text) else { continue; };
                  let Some(entries) = json.as_object() else { continue; };
                  checked += 1;
                  for (key, meta) in entries {
                      let Ok(hash) = u64::from_str_radix(key, 16) else { continue; };
                      if !meta.get("ok").and_then(|v| v.as_bool()).unwrap_or(false) { continue; }
                      let filename = format!("{hash:016x}");
                      if !alt.join(format!("{filename}.wgsl")).is_file() { continue; }
                      let needs_consts = meta.get("consts").is_some();
                      if needs_consts && !alt.join(format!("{filename}.consts.json")).is_file() { continue; }
                      let name = |s: &str| meta.get(s).and_then(|v| v.as_str()).unwrap_or("");
                      let label = format!("{}::{}", name("effect"), name("program"));
                      if label == "::" { continue; }
                      if let Some(original) = index.get_mut(&hash) {
                          // Preserve the primary index's authoritative translation status;
                          // never overwrite an explicitly failed translation or mismatched label.
                          if original.ok && original.label == label && original.consts == needs_consts
                              && original.source_dir.is_none()
                              && !dir.join(format!("{filename}.wgsl")).is_file() {
                              original.source_dir = Some(alt.clone());
                              recovered_file += 1;
                          }
                      } else {
                          index.insert(hash, Entry {
                              label, ok: true, consts: needs_consts, error: None,
                              source_dir: Some(alt.clone()),
                          });
                          recovered_index += 1;
                      }
                  }
              }
              let missing_wgsl = index.iter().filter(|(hash, entry)| {
                  entry.ok && entry.source_dir.is_none()
                      && !dir.join(format!("{hash:016x}.wgsl")).is_file()
              }).count();
              let missing_consts = index.iter().filter(|(hash, entry)| {
                  entry.ok && entry.consts && entry.source_dir.is_none()
                      && !dir.join(format!("{hash:016x}.consts.json")).is_file()
              }).count();
              log::info!("SN512A V8.8 shader audit: total_index={} sibling_packs={} exact_wgsl_recovered={} exact_index_recovered={} missing_wgsl={} missing_consts={} root={}",
                  index.len(), checked, recovered_file, recovered_index,
                  missing_wgsl, missing_consts, dir.display());
              if missing_wgsl != 0 || missing_consts != 0 {
                  log::warn!("SN512A V8.8: missing translated shader assets cannot be reconstructed from hashes; provide a COMPLETE matching translated shader pack. Do not substitute shaders by label.");
              }
          }

          '''
          replace_exact(shader, 'impl Library {\n    pub fn open(dir: &Path) -> Result<Library> {',
                        helper+'impl Library {\n    pub fn open(dir: &Path) -> Result<Library> {',
                        'exact hash-only alternate shader bundle resolver')

          # CPU pass setup: avoid repeated geometric Vec reallocations (these temporary
          # attachment/format vectors can grow from 0 to 8 every render pass).
          # Keep all wgpu pass ordering and target semantics identical to the stable build.
          draw='crates/glue5-gpu/src/draw.rs'
          replace_exact(draw,
          '''        let mut colors: Vec<Option<(wgpu::TextureView, Option<u32>, wgpu::LoadOp<wgpu::Color>)>> = Vec::new();
                  let mut targets = Vec::new();''',
          '''        // SN512A V8.8 CPU: reserve the fixed D3D11 maximum of 8 color targets
                  // to avoid capacity growth/reallocation during every new render pass.
                  let mut colors: Vec<Option<(wgpu::TextureView, Option<u32>, wgpu::LoadOp<wgpu::Color>)>> = Vec::with_capacity(8);
                  let mut targets = Vec::with_capacity(8);''',
          'pre-reserve render target vectors, 8 attachments')

          # Public Documents: write an easy-to-upload shader-only fault inventory,
          # in addition to full host.log and CPU scheduler CSV. This contains no assets.
          docs='crates/glue5/src/sn512a_public_docs.rs'
          replace_exact(docs,
          '''    previous: Option<File>,
          }''',
          '''    previous: Option<File>,
              shader_report: Option<File>,
          }''',
          'add shader-only report to Documents exporter')
          replace_exact(docs,
          '''            previous: file("host-previous.log"),
                  };''',
          '''            previous: file("host-previous.log"),
                      shader_report: file("shaders-missing.txt"),
                  };''',
          'create Documents shaders-missing.txt')
          replace_exact(docs,
          '''            let _ = writeln!(f, "Never upload your private game.wasm or 20 GB game assets.");''',
          '''            let _ = writeln!(f, "shaders-missing.txt: translated shader inventory, unavailable hashes, and compilation issues");
                      let _ = writeln!(f, "Never upload your private game.wasm or 20 GB game assets.");''',
          'document new public shader report')
          replace_exact(docs,
          '''            if let Some(f) = docs.host.as_mut() {
                          let _ = f.write_all(line.as_bytes());
                          let _ = f.flush(); // Preserve the error even on an abrupt GPU failure.
                      }''',
          '''            if let Some(f) = docs.host.as_mut() {
                          let _ = f.write_all(line.as_bytes());
                          let _ = f.flush(); // Preserve the error even on an abrupt GPU failure.
                      }
                      // Keep an independent small report for missing/failed shader
                      // assets and pipeline failures; do not include actual shader data.
                      if line.contains(" shader audit:") || line.contains(" shader ") && line.contains("unusable:")
                          || line.contains("SN512A V8.8: missing translated shader")
                          || line.contains("skipped compute ")
                          || line.contains("pipeline failed") {
                          if let Some(f) = docs.shader_report.as_mut() {
                              let _ = f.write_all(line.as_bytes());
                              let _ = f.flush();
                          }
                      }''',
          'live shader-only fault report in public Documents')

          required={
          'shader':('SN512A V8.8 shader audit:','source_root.join','sn512a_recover_exact_shaders'),
          'draw':('Vec::with_capacity(8)','SN512A V8.7: one frequently repeated group'),
          'docs':('file("shaders-missing.txt")','Documents/GLUE5-Logs/'),
          }
          for file,marks in [(shader,required['shader']),(draw,required['draw']),(docs,required['docs'])]:
              s=Path(file).read_text()
              for m in marks:
                  if m not in s:raise SystemExit(f'Verification missing {m} in {file}')
          submit=Path('crates/glue5-gpu/src/submit.rs').read_text()
          for key in ('const FRAMES_IN_FLIGHT: usize = 1;','const PENDING: usize = 4;',
                      'const ENCODE_THREADS: usize = 1;','SN512A V8.5 GPU lifetimes:'):
              if key not in submit:raise SystemExit(f'Missing known-stable sync guarantee: {key}')
          report=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'v85-audit'
          report.mkdir(parents=True,exist_ok=True)
          (report/'v88-shader-cpu-report.json').write_text(json.dumps({
              'v88': 'exact hash-only shader source fallback; no fabricated WGSL',
              'encoder_workers':1,'gpu_lifetimes':'V8.5 STRICT unchanged',
              'cpu':'8 preallocated render targets; V8.7 hot bind-group cache retained',
              'public_shader_report':'Documents/GLUE5-Logs/SN512A-<session>-shaders-missing.txt',
              'changes':CHANGES,
          },indent=2)+'\n')
          for f in (shader, draw, docs):
              p=Path(f)
              (report/(p.name+'.v88.sha256')).write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          print(json.dumps(CHANGES,indent=2))
          PY_SN512A_V88
          python3 -m py_compile /tmp/sn512a_v88_patch.py
          python3 /tmp/sn512a_v88_patch.py
          git diff --check
          grep -Fq 'SN512A V8.8 shader audit:' crates/glue5-gpu/src/shader.rs
          grep -Fq 'file("shaders-missing.txt")' crates/glue5/src/sn512a_public_docs.rs
          grep -Fq 'const ENCODE_THREADS: usize = 1;' crates/glue5-gpu/src/submit.rs
          echo 'V8.8: Exact-hash shader bundle recovery (only from user-owned sibling shader packs, no fabricated shader code). CPU render-pass target vectors preallocated. V8.7 validated 1-worker CPU fastpaths retained. Missing shader hash reports exported to public Documents/GLUE5-Logs.' >> "$GITHUB_STEP_SUMMARY"
      - name: V8.9 - Respect shader consts true or false metadata (67 shader fixes)
