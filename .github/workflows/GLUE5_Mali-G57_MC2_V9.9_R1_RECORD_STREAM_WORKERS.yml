          sampler = '''//! SN512A GLUE5 V9.8 R3 — inexpensive, five-second telemetry on Android.
          //! Uses GLUE5's existing GPU timing snapshots. The timing data are *recent*
          //! frame histories, not synchronized per-pass GPU breakdowns. Thread shares
          //! are per-core over the previous five seconds, not hardware GPU utilization.
          //! Operates off the render/game threads; never asks the GPU to wait.
          use std::collections::HashMap;
          use std::fs::{self, File};
          use std::io::Write;
          use std::sync::atomic::{AtomicU32, Ordering};
          use std::time::{Duration, Instant};
          
          static RENDER_W: AtomicU32 = AtomicU32::new(0);
          static RENDER_H: AtomicU32 = AtomicU32::new(0);
          static OUTPUT_W: AtomicU32 = AtomicU32::new(0);
          static OUTPUT_H: AtomicU32 = AtomicU32::new(0);
          
          pub(crate) fn resolution(back: Option<(u32,u32)>, display: (u32,u32)) {
              let (w,h) = back.unwrap_or((0,0));
              RENDER_W.store(w, Ordering::Relaxed);
              RENDER_H.store(h, Ordering::Relaxed);
              OUTPUT_W.store(display.0, Ordering::Relaxed);
              OUTPUT_H.store(display.1, Ordering::Relaxed);
          }
          
          fn mean(v: &[f32]) -> Option<f64> {
              let tail = &v[v.len().saturating_sub(glue5_gpu::perf::FRAMES / 4)..];
              if tail.is_empty() { None } else { Some(tail.iter().map(|&x| x as f64).sum::<f64>() / tail.len() as f64) }
          }
          fn value(m: Option<f64>) -> String { m.map_or(String::new(), |x| format!("{x:.3}")) }
          fn write_both(private: &mut Option<File>, bytes: &[u8], public: fn(&[u8])) {
              if let Some(f) = private.as_mut() { let _ = f.write_all(bytes); let _ = f.flush(); }
              public(bytes);
          }
          
          pub(crate) fn start() {
              let _ = std::thread::Builder::new().name("glue5-perf-5s".into()).spawn(|| {
                  // Separate app-private fallback if MediaStore is unavailable.
                  let private_dir = crate::paths::android_external_dir().map(|root| root.join("logs"));
                  if let Some(dir) = private_dir.as_ref() { let _ = fs::create_dir_all(dir); }
                  let mut perf_file = private_dir.as_ref().and_then(|d| File::create(d.join("perf-5s.csv")).ok());
                  let mut cpu_file = private_dir.as_ref().and_then(|d| File::create(d.join("cpu-5s.csv")).ok());
                  let ph = b"elapsed_s,render_w,render_h,output_w,output_h,samples,frame_ms,render_ms,gpu_ms,main_est_ms,fps,main_core_pct,process_core_pct,draws,passes,submits,gpu_mem_mib\\n";
                  let ch = b"elapsed_s,tid,thread,core_pct\\n";
                  write_both(&mut perf_file, ph, crate::sn512a_public_docs::perf);
                  write_both(&mut cpu_file, ch, crate::sn512a_public_docs::cpu);
                  let started = Instant::now();
                  let mut previous_at = Instant::now();
                  let mut previous: HashMap<u64, Duration> = glue5_runtime::cpu::threads()
                      .into_iter().map(|t| (t.id, t.cpu)).collect();
                  loop {
                      std::thread::sleep(Duration::from_secs(5));
                      let at = Instant::now();
                      let wall = at.duration_since(previous_at).as_secs_f64().max(0.001);
                      let threads = glue5_runtime::cpu::threads();
                      let mut next: HashMap<u64, Duration> = HashMap::with_capacity(threads.len());
                      let mut busy: Vec<(u64, String, f64)> = Vec::new();
                      let mut main_pct = None;
                      let mut process_pct = 0.0f64;
                      for t in threads {
                          if let Some(old) = previous.get(&t.id) {
                              let pct = t.cpu.saturating_sub(*old).as_secs_f64() * 100.0 / wall;
                              if t.name == "engine main" { main_pct = Some(pct); }
                              process_pct += pct;
                              if pct > 0.1 {
                                  let name = t.name.replace(',', "_").replace('\\n', "_").replace('\\r', "_");
                                  busy.push((t.id, name, pct));
                              }
                          }
                          next.insert(t.id, t.cpu);
                      }
                      previous = next;
                      previous_at = at;
                      busy.sort_by(|a,b| b.2.total_cmp(&a.2));
                      // The native GPU overlay already keeps only the 120 most recent frames.
                      // Its displayed figures are the last ~30 frames; match that window.
                      let s = glue5_gpu::perf::snapshot();
                      if s.frame_ms.len() < 5 { continue; } // menu or loading; not gameplay
                      let frame = mean(&s.frame_ms);
                      let render = mean(&s.render_ms);
                      let gpu = mean(&s.gpu_ms);
                      let fps = frame.filter(|&f| f > 0.0).map(|f| 1000.0/f);
                      // The overlay estimates the main-thread contribution this way;
                      // NOT an independently timed game-main frame duration.
                      let main_est = frame.zip(main_pct).map(|(f,p)| f*p/100.0);
                      let elapsed = at.duration_since(started).as_secs_f64();
                      let mem_mib = s.gpu_bytes as f64 / 1048576.0;
                      let line = format!("{elapsed:.1},{},{},{},{},{},{},{},{},{},{},{},{:.2},{},{},{},{mem_mib:.2}\\n",
                          RENDER_W.load(Ordering::Relaxed), RENDER_H.load(Ordering::Relaxed),
                          OUTPUT_W.load(Ordering::Relaxed), OUTPUT_H.load(Ordering::Relaxed),
                          s.frame_ms.len(), value(frame), value(render), value(gpu),
                          value(main_est), value(fps), value(main_pct), process_pct,
                          s.draws, s.passes, s.submits);
                      write_both(&mut perf_file, line.as_bytes(), crate::sn512a_public_docs::perf);
                      // Top 12 CPU-heavy threads, one CSV row each, every 5s.
                      let mut cpu_rows = String::new();
                      for (tid, name, pct) in busy.iter().take(12) {
                          cpu_rows.push_str(&format!("{elapsed:.1},{tid},{name},{pct:.2}\\n"));
                      }
                      if !cpu_rows.is_empty() {
                          write_both(&mut cpu_file, cpu_rows.as_bytes(), crate::sn512a_public_docs::cpu);
                      }
                  }
              });
          }
          '''
          # Preserve standalone source in build script and fail if repeated.
          file=srcdir/'sn512a_perf5.rs'
          if file.exists(): raise SystemExit('V9.8 R3 ABORT: telemetry module already exists')
