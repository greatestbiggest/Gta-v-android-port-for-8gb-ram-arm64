           'GPU recorder is a single dedicated thread':'.name("gpu record".into())' in (root/gpu).read_text(),
           'read-ahead default OFF':'sn512a_io_prefetch: false' in (root/settings).read_text(),
           'stream queue bounded':'sync_channel::<Sn512aHint>(8)' in (root/runtime).read_text(),
           'local files only':'file.path.starts_with("/game/")' in (root/runtime).read_text(),
           'no WASM heap touched':'SN512A_PREFETCH_ON' in (root/runtime).read_text(),
           'old log modes intact':'SN512A LOGGING & DIAGNOSTICS' in (root/ui).read_text(),
           'manual scheduling intact':'MANUAL CPU SCHEDULING' in (root/ui).read_text(),
           'native present still present':'const PRESENT_WGSL' in (root/'crates/glue5-gpu/src/present.rs').read_text(),
          }
          if not all(checks.values()):
              raise SystemExit('V9.9 R1 ABORT: invariants failed '+repr(checks))
          audit=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'v85-audit'
          audit.mkdir(parents=True,exist_ok=True)
          (audit/'v99r1-record-stream-audit.json').write_text(json.dumps({
           'version':'V9.9 R1','checks':checks,'GPU_submission_changed':False,
           'recording':'EXISTING one GPU D3D11 stateful recording thread renamed gpu record; independently schedulable',
           'new_worker':'Optional local game-file POSIX_FADV_WILLNEED page-cache read-ahead, 1 thread, 8 pending hints',
           'not_implemented':'Moving 40-60% main-engine calls or asynchronous WASM heap growth; unsafe/unverified promises',
           'impact':'Potentially fewer disk read stalls, NOT guaranteed FPS increase; can consume I/O bandwidth',
           'game_assets_modified':False,'android_build_tested':False
          },indent=2)+'\n')
          print('V9.9 R1: GPU recorder identified; opt-in dedicated IO read-ahead worker ready; GPU submission unmodified.')
          PY_SN512A_V99R1
          python3 -m py_compile /tmp/sn512a_v99r1_record_stream.py
          python3 /tmp/sn512a_v99r1_record_stream.py .
          git diff --check
          grep -Fq '.name("gpu record".into())' crates/glue5-gpu/src/lib.rs
          grep -Fq 'sync_channel::<Sn512aHint>(8)' crates/glue5-runtime/src/vfs.rs
          grep -Fq 'sn512a_enable_io_prefetch' crates/glue5/src/app.rs
          grep -Fq 'sn512a_gpu_record_affinity: 0' crates/glue5/src/settings.rs
          grep -Fq 'sn512a_io_prefetch: false' crates/glue5/src/settings.rs
          grep -Fq 'const FRAMES_IN_FLIGHT: usize = 1;' crates/glue5-gpu/src/submit.rs
          grep -Fq 'V9.6_R2 MAP_ALPHA_GUARD' crates/glue5-gpu/src/draw.rs
          echo 'V9.9 R1: GPU command recording already runs on one dedicated CPU worker; it is now named gpu record and independently pin-able. Added optional 256 KiB local game-file page-cache hint worker (8-entry nonblocking queue), OFF by default. This does NOT move WASM heap growth or promise 40-60 percent CPU savings; queue, fences, GPU submission unchanged. Full APK build required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save V9.9 R1 source patch audit (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: MALI-G57-MC2-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}-${{ inputs.cpu_fastpaths }}-${{ inputs.encoder_workers }}
          path: ${{ runner.temp }}/v85-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Set up release signing key (preserve it for future updates)
        run: |
          set -euo pipefail
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          cd ~/.android
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" get '${{ steps.game.outputs.release }}' Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE/glue5" exec -- keytool -genkeypair -noprompt \
              -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=SN512A V8 Debug,O=Android,C=US'
          fi
      - name: Compile GLUE 5 Android AOT game and app
        env:
          # Official GLUE 5 build script explicitly permits an unknown build in
          # experimental mode. Hook resolution can fail if code differs.
          GLUE5_ALLOW_UNKNOWN_BUILD: '1'
        run: |
          set -euo pipefail
          mise run android:build
          test -s target/android/gradle/outputs/apk/release/Glue5-release.apk
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk "$RUNNER_TEMP/Glue5-android.apk"
          cp ~/.android/debug.keystore "$RUNNER_TEMP/Glue5-android.keystore"
          # Confirm that the three mandatory JNI libraries are actually in
          # the signed APK. Missing optional AdrenoTools are acceptable on Mali.
          python3 - "$RUNNER_TEMP/Glue5-android.apk" <<'PY_APK_CHECK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              required = {f'lib/arm64-v8a/{name}' for name in
                          ('libglue5.so', 'libSDL3.so', 'libc++_shared.so')}
              absent = sorted(required - names)
              if absent:
                  raise SystemExit('Signed APK missing mandatory JNI libraries: ' + ', '.join(absent))
              print('Verified: GLUE 5, SDL3 and libc++ JNI libraries are in signed APK')
          PY_APK_CHECK
          sha256sum "$RUNNER_TEMP/Glue5-android.apk"
          cp "$RUNNER_TEMP/Glue5-android.apk" "$RUNNER_TEMP/Glue5-android-MALI-G57-MC2-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}.apk"
      - name: Keep an additional downloadable signed APK in this Actions run (private)
        uses: actions/upload-artifact@v4
        with:
          name: MALI-G57-MC2-GLUE5-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}-signed-APK
          path: ${{ runner.temp }}/Glue5-android-MALI-G57-MC2-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Keep signed test APK private in the SAME DRAFT release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cp Glue5-android.apk Glue5-android-MALI-G57-MC2-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" upload '${{ steps.game.outputs.release }}' Glue5-android-MALI-G57-MC2-V9.9-R1-RECORD-STREAM-${{ inputs.native_present_fastpath }}-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          echo 'V9.9 R1: retains V9.8 R6 log mode selection, adds dedicated GPU record thread affinity and opt-in local asset I/O read-ahead worker. Preserves GPU queue, fences, map and native present; performance TBD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the V9.9 R1 signed APK in the Artifacts section of this workflow run, or from the same private draft release; upscaler fallback and map/driver safety preserved; actual GPU FPS still needs device validation.' >> "$GITHUB_STEP_SUMMARY"
