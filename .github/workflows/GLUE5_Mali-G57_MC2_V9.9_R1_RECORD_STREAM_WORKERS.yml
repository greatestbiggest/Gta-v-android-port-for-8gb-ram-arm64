          cat > /tmp/sn512a_v98_native_present.py <<'PY_V98_PRESENT'
          from pathlib import Path
          import hashlib, json, os
          
          p = Path('crates/glue5-gpu/src/present.rs')
          src = p.read_text()
          original_sha = hashlib.sha256(src.encode()).hexdigest()
          mode = os.environ['SN512A_NATIVE_PRESENT_FASTPATH']
          if mode not in {'yes', 'no'}:
