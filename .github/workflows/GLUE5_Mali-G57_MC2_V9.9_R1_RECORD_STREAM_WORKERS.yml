                        let original = words(self.s.blend);
                        if vs.label == "im::VS_TransformUnlit_IM"
                            && ps.is_some_and(|p| p.label == "im::PS_BlitDepthToAlpha")
                            && original.as_deref().is_some_and(shader::pause_map_blend)
                        {
                            static V96R2_GUARD_EVENTS: std::sync::atomic::AtomicU64 =
                                std::sync::atomic::AtomicU64::new(0);
                            let n = V96R2_GUARD_EVENTS.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
                            let mut changed = original;
                            if let Some(words) = changed.as_deref_mut() {
                                // D3D11_BLEND_DESC target-zero mask: word 9.
                                // Clear the ALPHA write bit, retaining all other
                                // color-mask bits as well as the existing blend
                                // factors. This guard cannot erase map alpha.
                                if words.len() > 9 {
                                    words[9] &= !8u32;
                                }
                            }
                            if n < 4 {
                                log::info!("MALI-G57-MC2 V9.6_R2 MAP_ALPHA_GUARD: alpha_write_suppressed=true blend_id={} rt0={} depth={} count={}",
                                    self.s.blend, self.s.rt[0].tex, self.s.ds.tex, n);
                            }
                            changed
                        } else {
                            original
                        }
                    },'''
          draw.write_text(src.replace(old,new,1))
          ds=draw.read_text()
          sub=Path('crates/glue5-gpu/src/submit.rs').read_text()
          checks={
              'stable single rendering finisher':'const ENCODE_THREADS: usize = 1;' in sub,
              'dedicated upload finisher':'SN512A V9.3 DEDICATED_UPLOAD_FINISH:' in sub,
