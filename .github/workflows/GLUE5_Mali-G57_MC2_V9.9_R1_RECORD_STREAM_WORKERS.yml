                    // depth-to-alpha blits use MIN-alpha blending and an
                    // ALPHA-ONLY write mask. R1 proved the scissor is already
                    // expanded to the entire target, yet the outer map still
                    // disappears. Test whether repeated alpha-min passes erase
                    // it, while leaving other map/UI draws entirely intact.
                    // Only the map-specific VS/PS pair with the pause MIN state
                    // changes. We do not alter shaders, texture contents,
                    // synchronization, or the engine's game assets.
