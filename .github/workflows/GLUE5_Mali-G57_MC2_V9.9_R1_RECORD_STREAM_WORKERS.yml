          from pathlib import Path
          import hashlib, json, os
          f = Path('crates/glue5-gpu/src/shader.rs')
          text = f.read_text()
          # Critical bug: .is_some() treats {"consts":false} as true.
          # The working index has 67 extra hashes with consts:false, and
