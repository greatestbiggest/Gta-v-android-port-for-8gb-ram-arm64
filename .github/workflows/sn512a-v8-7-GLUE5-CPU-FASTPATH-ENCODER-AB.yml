# V8.7: Same build route as hardware-tested V8.6 (source comes from mempage4k/glue5).
# Experimental GPU CPU fastpaths and optional 2 encoding workers. Preserve V8.5/8.6 APK.
# THIS IS NOT A VERIFIED COMPILED BUILD; GitHub must compile it.
# V8.6 adds low-impact scheduler instrumentation on top of confirmed stable V8.5.
# Default is EXACT V8.5 GPU parallelism (1 encoder). Optional 2-worker test MAY destabilize.
# Keep the known-good V8.5 APK: this build uploads under a new name.
# Experimental V8.5 SN512A GPU device-loss A/B: change Vulkan command-pool recycling frequency only.
# Important: GLUE 5 is a different runtime from the existing BytArch/V5b/V7 APK.
# The special behavior works because GLUE 5 ALREADY hooks the RAGE buddy allocator.
# It is NOT safe to simulate this by capping WebAssembly memory to 768 MiB.
#
# Private game data: attach your own matching game.wasm to a DRAFT RELEASE in
# this repository, NEVER commit it or publish it. The APK goes back into that draft.
name: SN512A GTA V V8.7 - CPU Recording, Bind Cache and Encoder A-B

on:
  workflow_dispatch:
    inputs:
      pool_policy:
        description: "Vulkan command-pool recycling: conservative (less frequent) or baseline (V8.3 behavior)"
        required: true
        type: choice
        options:
          - conservative
          - baseline
        default: baseline
      sync_policy:
        description: "GPU resource lifetime: strict waits for completed GPU epochs; baseline retains V8.5 behavior"
        required: true
        type: choice
        options:
          - strict
        default: strict
      gpu_soft_budget_mb:
        description: "Live GPU allocation estimate triggering safe cache trimming (not a hard limit)"
        required: true
        type: choice
        options:
          - "640"
          - "704"
          - "768"
        default: "704"
      encoder_workers:
        description: "GPU encoding workers: 2=experimental parallel test; 1=stable baseline"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "2"
      cpu_fastpaths:
        description: "Deduplicate unchanged render-target state and cache hot bind-group lookups"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

permissions:
  contents: write

concurrency:
  group: sn512a-v87-cpu-optimized-glue5-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: glue5
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/glue5
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out our workflow repository (never includes game.wasm)
        uses: actions/checkout@v4
        with:
          path: user-repo
          persist-credentials: false
      - name: Check out GLUE 5 source for its actual memory-budget hooks
        uses: actions/checkout@v4
        with:
          repository: mempage4k/glue5
          ref: main
          path: glue5
          fetch-depth: 1
          persist-credentials: false
      - name: Verify low-memory streaming budget and force 768 MiB for this SN512A test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          imports = Path('crates/glue5-runtime/src/imports.rs')
          mem = Path('crates/glue5-runtime/src/memory.rs')
          old = imports.read_text()
          hook = mem.read_text()
          expected = 'None if name == "gameResourceMB" && low => default.min(768),'
          replacement = 'None if name == "gameResourceMB" => 768,'
          if old.count(expected) != 1:
              raise SystemExit('GLUE5 upstream changed gameResourceMB handling; refusing unverified build.')
          required = (
              'pub(crate) fn budget_resource_heap(mb: u32)',
              'pub(crate) unsafe extern "C" fn grow_heap(',
              'pub(crate) unsafe extern "C" fn memory_available(',
              'pub(crate) unsafe extern "C" fn largest_block(',
              'hooks.grow_heap = Some(grow_heap);',
              'hooks.memory_available = Some(memory_available);',
              'hooks.largest_block = Some(largest_block);',
          )
          missing = [s for s in required if s not in hook]
          if missing:
              raise SystemExit('GLUE5 streaming-memory enforcement hooks missing: ' + repr(missing))
          if 'crate::memory::budget_resource_heap(value)' not in old:
              raise SystemExit('GLUE5 no longer connects the gameResourceMB value to heap budget.')
          imports.write_text(old.replace(expected, replacement, 1))
          assert imports.read_text().count(replacement) == 1
          print('V8/source verified: Android gameResourceMB=768 MiB; RAGE streaming budget hooks available.')
          print('The hooks intercept availability checks and allow necessary allocation growth.')
          PY
          git diff --check
          git diff -- crates/glue5-runtime/src/imports.rs
          sha256sum crates/glue5-runtime/src/imports.rs | tee "$RUNNER_TEMP/glue5_v8_memory_patch_sha256.txt"
      - name: Install SN512A V8.2 on-device GPU diagnostics (no root or ADB)
        run: |
          set -euo pipefail
          python3 - <<'PY_V82'
          from pathlib import Path
          path = Path('crates/glue5/src/lib.rs')
          src = path.read_text()
          target = 'mod paths;\n'
          assert src.count(target) == 1, 'GLUE5 path modules changed'
          src = src.replace(target, target + '#[cfg(target_os = "android")]\nmod sn512a_diag;\n', 1)
          old = '''        // RUST_LOG as on desktop (the launch intent's extras, see Glue5Activity).
                  let spec = std::env::var("RUST_LOG").unwrap_or_else(|_| "info".into());
                  let filter = android_logger::FilterBuilder::new().parse(&spec).build();
                  let level = filter.filter();
                  android_logger::init_once(android_logger::Config::default().with_tag("glue5").with_max_level(level).with_filter(filter));'''
          # The Android native application uses only one process-wide log logger.
          # Replace its logcat-only logger with a logcat + accessible-file logger.
          assert src.count(old)==1, 'GLUE5 Android logger source changed'
          src=src.replace(old, '''        // SN512A V8.2: initialize file logging in app::run
                  // after SDL is ready to provide the app-owned external path.''', 1)
          path.write_text(src)
          path=Path('crates/glue5/src/paths.rs')
          src=path.read_text()
          old='#[cfg(target_os = "android")]\nfn android_external_dir() -> Option<PathBuf> {'
          assert src.count(old)==1, 'GLUE5 Android external folder helper changed'
          path.write_text(src.replace(old, '#[cfg(target_os = "android")]\npub(crate) fn android_external_dir() -> Option<PathBuf> {',1))
          path=Path('crates/glue5/src/app.rs')
          src=path.read_text()
          # Match the SDL initialization statement by its content, rather than
          # assuming eight leading spaces. Current GLUE 5 uses four.
          startup='let sdl = sdl3::init().map_err(|e| anyhow!("SDL: {e}"))?;'
          assert src.count(startup)==1, 'GLUE5 SDL initialization statement missing or ambiguous'
          src=src.replace(startup, startup + '\n    #[cfg(target_os = "android")]\n    crate::sn512a_diag::init();', 1)
          anchor='''        let why = why.as_str();
                  if let Err(e) = std::fs::write(self.user_dir.join(FAILURE_FILE), why) {'''
          assert src.count(anchor)==1, 'GLUE5 game-stopped handler changed'
          src=src.replace(anchor, '''        let why = why.as_str();
                  #[cfg(target_os = "android")]
                  crate::sn512a_diag::save_failure(&self.user_dir, why);
                  if let Err(e) = std::fs::write(self.user_dir.join(FAILURE_FILE), why) {''',1)
          path.write_text(src)
          PY_V82
          cat > crates/glue5/src/sn512a_diag.rs <<'RUST_V82'
          //! SN512A diagnostics: preserves GLUE 5's GPU and runtime log:: events
          //! in Android/data/local.glue5/files/logs/ without READ_LOGS, ADB or root.
          //! Uses only app-owned external storage; does not modify game files.
          use std::fs::{self, File};
          use std::io::{self, Read, Seek, SeekFrom, Write};
          use std::path::{Path, PathBuf};
          use std::sync::{Mutex, OnceLock};
          use std::time::{SystemTime, UNIX_EPOCH};
          use log::{Level, LevelFilter, Log, Metadata, Record};
          
          #[link(name = "log")]
          unsafe extern "C" {
              fn __android_log_write(priority: std::os::raw::c_int,
                                     tag: *const std::os::raw::c_char,
                                     text: *const std::os::raw::c_char) -> std::os::raw::c_int;
          }
          
          const MAX_FILE_BYTES: u64 = 4 * 1024 * 1024;
          struct DualLogger {
              path: Option<PathBuf>,
              output: Mutex<Option<File>>,
          }
          static LOGGER: OnceLock<DualLogger> = OnceLock::new();
          
          fn log_dir() -> Option<PathBuf> {
              let root = crate::paths::android_external_dir()?;
              let dir = root.join("logs");
              fs::create_dir_all(&dir).ok()?;
              Some(dir)
          }
          
          impl Log for DualLogger {
              fn enabled(&self, m: &Metadata<'_>) -> bool { m.level() <= Level::Info }
              fn log(&self, record: &Record<'_>) {
                  if !self.enabled(record.metadata()) { return; }
                  let now = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default();
                  let line = format!("{}.{:03} [{}] {}: {}\n",
                      now.as_secs(), now.subsec_millis(), record.level(), record.target(), record.args());
                  // Keep Android logcat output, for standard troubleshooting too.
                  let prio = match record.level() {
                      Level::Error => 6, Level::Warn => 5, Level::Info => 4,
                      Level::Debug => 3, Level::Trace => 2,
                  };
                  if let Ok(c) = std::ffi::CString::new(line.trim_end().replace('\0', " ")) {
                      unsafe { __android_log_write(prio, c"glue5".as_ptr(), c.as_ptr()); }
                  }
                  if let Ok(mut out) = self.output.lock() {
                      if let Some(path) = &self.path {
                          if out.as_ref().is_some_and(|f| f.metadata().is_ok_and(|m| m.len() >= MAX_FILE_BYTES)) {
                              // Retain the most recent 4 MiB, bounded to 8 MiB total.
                              *out = None;
                              let _ = fs::rename(path, path.with_file_name("host-previous.log"));
                              *out = File::create(path).ok();
                          }
                      }
                      if let Some(f) = out.as_mut() {
                          let _ = f.write_all(line.as_bytes());
                          // Device-lost errors must survive an immediate process exit.
                          let _ = f.flush();
                      }
                  }
              }
              fn flush(&self) {
                  if let Ok(mut out) = self.output.lock() {
                      if let Some(f) = out.as_mut() { let _ = f.flush(); }
                  }
              }
          }
          
          pub(crate) fn init() {
              let path = log_dir().map(|dir| dir.join("host.log"));
              if let Some(p) = &path {
                  let _ = fs::rename(p, p.with_file_name("host-previous.log"));
              }
              let output = path.as_ref().and_then(|p| File::create(p).ok());
              let _ = LOGGER.set(DualLogger { path, output: Mutex::new(output) });
              if let Some(logger) = LOGGER.get() {
                  if log::set_logger(logger).is_ok() {
                      log::set_max_level(LevelFilter::Info);
                      log::info!("SN512A V8.2 diagnostics active; GPU errors mirrored to Android/data/local.glue5/files/logs/host.log");
                  }
              }
          }
          
          /// Copy only the last 1 MiB of the private game.log after a failure.
          /// The full 20 GiB game folder is never touched or moved.
          pub(crate) fn save_failure(user_dir: &Path, reason: &str) {
              log::error!("SN512A V8.2 game stopped: {reason}");
              let Some(dir) = log_dir() else { return; };
              let _ = fs::write(dir.join("last-failure.txt"), format!("{reason}\n"));
              let Ok(mut src) = File::open(user_dir.join("game.log")) else { return; };
              let Ok(len) = src.metadata().map(|m| m.len()) else { return; };
              if src.seek(SeekFrom::Start(len.saturating_sub(1 << 20))).is_err() { return; }
              if let Ok(mut dst) = File::create(dir.join("game-tail.log")) {
                  let _ = io::copy(&mut src.take(1 << 20), &mut dst);
                  let _ = dst.flush();
              }
          }
          RUST_V82
          # All device lost, heartbeat and wgpu device error messages flow
          # through log::error!, so the new logger records them without
          # changing GPU synchronization or resource ownership.
          grep -Fq 'sn512a_diag::init();' crates/glue5/src/app.rs
          grep -Fq 'SN512A V8.2' crates/glue5/src/sn512a_diag.rs
          grep -Fq 'save_failure(&self.user_dir, why);' crates/glue5/src/app.rs
          grep -Fq 'host.log' crates/glue5/src/sn512a_diag.rs
          git diff --check
          git diff --stat
          echo 'SN512A V8.2: diagnostic logger installed, 768MiB stream budget remains unchanged.'
      - name: Install SN512A V8.3 graphics controls in the native Settings menu
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v83_patch.py <<'PY_SN512A_GRAPHICS'
          #!/usr/bin/env python3
          """Add an SN512A graphics settings tab to GLUE5's native pre-launch UI.
          
          Uses upstream GTA V settings.xml to alter actual game graphics settings. Only
          edits while game is stopped. Existing engine pause-menu controls still work.
          """
          from pathlib import Path
          import sys
          
          root = Path(sys.argv[1])
          
          
          def transform(rel, ops):
              f = root / rel
              src = f.read_text()
              for old, new, label in ops:
                  n = src.count(old)
                  if n != 1:
                      raise RuntimeError(f'{rel}: {label}: expected 1 match, found {n}. Refusing to patch unknown upstream source')
                  src = src.replace(old, new, 1)
              f.write_text(src)
              print('patched', f)
          
          
          # V8.3 FIX2: match only the SettingsTab enum, not the adjacent
          # `pub struct Ui` declaration. The previous brittle complete-span
          # string raised `expected 1 match, found 0` on the user's checkout.
          import re
          ui_file = root / 'crates/glue5/src/ui.rs'
          original_ui = ui_file.read_text()
          enum = re.search(r'(?s)\benum\s+SettingsTab\s*\{(?P<body>.*?)\n\}', original_ui)
          if enum is None:
              raise RuntimeError('SettingsTab enum not present; refusing unknown source')
          body = enum.group('body')
          if len(re.findall(r'(?m)^\s*Video,\s*$', body)) != 1:
              raise RuntimeError('Expected one Video tab in SettingsTab')
          if 'Graphics,' in body:
              raise RuntimeError('Graphics tab already present; use clean upstream checkout')
          if len(re.findall(r'(?m)^\s*Controls,\s*$', body)) != 1 or len(re.findall(r'(?m)^\s*Game,\s*$', body)) != 1:
              raise RuntimeError('Expected Controls and Game tabs not found')
          new_body, replacements = re.subn(
              r'(?m)^(?P<indent>[ \t]*)Video,[ \t]*$',
              lambda m: m.group(0) + '\n' + m.group('indent') + 'Graphics,',
              body, count=1)
          if replacements != 1:
              raise RuntimeError('Could not insert Graphics enum variant')
          updated_ui = original_ui[:enum.start('body')] + new_body + original_ui[enum.end('body'):]
          ui_file.write_text(updated_ui)
          print('Patched SettingsTab enum with Graphics, preserving #[default] Video')
          
          transform('crates/glue5-runtime/src/game_settings.rs', [(
              '#[cfg(test)]\nmod tests {',
              '''/// Read a graphic setting from settings.xml (or the engine's defaults).
          /// Exposed to the SN512A pre-launch UI; no live game-memory manipulation.
          pub fn read_setting(user_dir: &Path, name: &str) -> Option<String> {
              let xml = std::fs::read_to_string(path(user_dir)).unwrap_or_else(|_| DEFAULTS.to_string());
              let tag = format!("<{name} value=\\\"");
              let start = xml.find(&tag)? + tag.len();
              let end = xml[start..].find('"')?;
              Some(xml[start..start + end].to_owned())
          }
          #[cfg(test)]
          mod tests {''',
              'read_setting helper',
          )])
          
          transform('crates/glue5/src/ui/pages.rs', [
              (
                  'let tabs = [(SettingsTab::Video, "VIDEO"), (SettingsTab::Controls, "CONTROLS"), (SettingsTab::Game, "GAME")];',
                  'let tabs = [(SettingsTab::Video, "VIDEO"), (SettingsTab::Graphics, "GRAPHICS"), (SettingsTab::Controls, "CONTROLS"), (SettingsTab::Game, "GAME")];',
                  'settings tabs',
              ),
              (
                  'fn settings_items(\n    ui: &mut egui::Ui,',
                  '''// SN512A V8.3: graphics settings are the ENGINE's own values, not
          // emulator-only switches. Use the normal in-game Graphics menu while playing.
          // Changing graphics from this page is allowed before game launch only.
          fn sn512a_graphics_choice(
              ui: &mut egui::Ui,
              dir: &std::path::Path,
              title: &str,
              key: &str,
              options: &[(&str, &str)],
          ) {
              let current = glue5_runtime::game_settings::read_setting(dir, key).unwrap_or_default();
              let mut selected = options.iter().position(|(v, _)| *v == current).unwrap_or(0);
              let choices: Vec<(usize, &str)> = options.iter().enumerate().map(|(i, (_, label))| (i, *label)).collect();
              let resp = setting(ui, title, Control::Choice, None, |ui| choice(ui, &mut selected, &choices));
              if resp.changed() {
                  if let Err(e) = glue5_runtime::game_settings::apply(dir, &[(key, options[selected].0)]) {
                      ui.colored_label(WARN, format!("Could not save {title}: {e}"));
                  }
              }
          }
          
          fn sn512a_graphics_menu(ui: &mut egui::Ui, settings: &mut Settings, status: &Status) {
              if status.started.is_some() {
                  ui.label("Graphics changes while playing: open the game's menu (☰ / Start), then Settings > Graphics or Advanced Graphics.");
                  ui.label("Some changes require restarting the game.");
                  return;
              }
              let Ok(dir) = paths::user_dir() else {
                  ui.colored_label(WARN, "Cannot locate game settings directory");
                  return;
              };
              // Preserve GLUE 5's normal initial low-memory baseline, then let the
              // player override individual quality options. Do not change 768 MiB pool.
              if settings.low_memory && !settings.low_preset_written {
                  if glue5_runtime::game_settings::apply_low_preset(&dir).is_ok() {
                      settings.low_preset_written = true;
                  } else {
                      ui.colored_label(WARN, "Could not write initial low-memory graphics preset");
                      return;
                  }
              }
              ui.label("SN512A graphics quality - applies at the next launch. Keep Low memory ON for 6 GB RAM.");
              ui.label("Higher texture, grass and distance settings can cause GPU loss or memory pressure.");
              sn512a_graphics_choice(ui, &dir, "View distance", "LodScale", &[
                  ("0.000000", "Minimum"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("0.750000", "75%"), ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Texture quality", "TextureQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Water quality", "WaterQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Grass quality", "GrassQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"), ("3", "Ultra"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Shadow quality", "ShadowQuality", &[
                  ("1", "Normal"), ("2", "High"), ("3", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Shadow edges", "Shadow_SoftShadows", &[
                  ("0", "Sharp"), ("1", "Soft"), ("2", "Softer"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Reflections", "ReflectionQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"), ("3", "Ultra"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Reflection AA", "ReflectionMSAA", &[
                  ("0", "Off"), ("2", "2x"), ("4", "4x"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Particle quality", "ParticleQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Population density", "CityDensity", &[
                  ("0.000000", "Minimum"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("0.750000", "75%"), ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Extended distance", "MaxLodScale", &[
                  ("0.000000", "Off"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Long shadows", "Shadow_LongShadows", &[
                  ("false", "Off"), ("true", "On"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Ambient occlusion", "SSAO", &[
                  ("0", "Off"), ("1", "Normal"), ("2", "High"),
              ]);
              sn512a_graphics_choice(ui, &dir, "FXAA", "FXAA_Enabled", &[
                  ("false", "Off"), ("true", "On"),
              ]);
              // MSAA is deliberately absent: GLUE 5's DirectX 10 shader path does not
              // support it. ShaderQuality Normal is also unsafe on this build.
              ui.label("MSAA disabled: unsupported by GLUE 5's DX10 shader path. Shader quality remains at the supported level.");
          }
          
          fn settings_items(
              ui: &mut egui::Ui,''',
                  'graphics menu insertion',
              ),
              (
                  '        SettingsTab::Controls => {',
                  '        SettingsTab::Graphics => sn512a_graphics_menu(ui, settings, status),\n        SettingsTab::Controls => {',
                  'graphics match arm',
              ),
              (
                  '[SettingsTab::Video, SettingsTab::Controls, SettingsTab::Game]',
                  '[SettingsTab::Video, SettingsTab::Graphics, SettingsTab::Controls, SettingsTab::Game]',
                  'settings layout tests',
              ),
          ])
          
          print('SN512A V8.3 pre-launch GRAPHICS menu source patch complete; not compiled or phone-tested.')
          PY_SN512A_GRAPHICS
          python3 -m py_compile /tmp/sn512a_v83_patch.py
          python3 /tmp/sn512a_v83_patch.py .
          git diff --check
          grep -Fq 'fn sn512a_graphics_menu' crates/glue5/src/ui/pages.rs
          grep -Fq 'Graphics,' crates/glue5/src/ui.rs
          git diff --stat
          echo 'V8.3 graphics tab added. Source-only validation; actual compile follows.'
      - name: Retrieve and verify the EXACT uploaded alternate game.wasm from PRIVATE DRAFT
        id: game
        run: |
          set -euo pipefail
          # Experimental: this file is NOT a GLUE 5 supported game build.
          # Exact SHA is from the user's GitHub diagnostic, not guessed.
          EXPECTED_SHA=dcd3dc966ae8ab78637137580da990f9acec2ecfba6c47d153bdc15e4b60ca02
          EXPECTED_BYTES=63202762
          game="$RUNNER_TEMP/game"
          dest="$game/b/8b0b5899ed/game.wasm"
          mkdir -p "$(dirname "$dest")"
          # Select newest PRIVATE DRAFT containing a completed game.wasm upload.
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | jq -r '[.[][] | select(.draft == true) | select(any(.assets[]?; .name == "game.wasm" and .state == "uploaded"))] | sort_by(.created_at) | last | .id // empty')
          test -n "$release" || { echo 'ERROR: No private draft release with uploaded game.wasm.'; exit 1; }
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release" | jq -r '[.assets[] | select(.name == "game.wasm" and .state == "uploaded")] | if length == 1 then .[0].id else empty end')
          test -n "$asset" || { echo 'ERROR: Draft must contain exactly one game.wasm.'; exit 1; }
          curl --fail --show-error --silent --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -o "$dest" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          actual_bytes=$(wc -c < "$dest" | tr -d ' ')
          actual_sha=$(sha256sum "$dest" | cut -d' ' -f1)
          echo "Uploaded file size: $actual_bytes; sha256: $actual_sha"
          if [ "$actual_bytes" != "$EXPECTED_BYTES" ] || [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo 'ERROR: This is not the previously observed alternate game.wasm. No unsafe generic bypass.'
            exit 1
          fi
          python3 - "$dest" <<'PYWASM'
          from pathlib import Path
          import sys
          with open(sys.argv[1], 'rb') as f:
              head = f.read(8)
          if head != b'\x00asm\x01\x00\x00\x00':
              raise SystemExit('Not a valid WebAssembly v1 binary header')
          print('WASM header valid; content still NOT independently GLUE5-compatible.')
          PYWASM
          echo "GLUE5_GAME_DIR=$game" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo 'WARNING: GLUE5_ALLOW_UNKNOWN_BUILD is enabled for this exact SHA only; compatibility and stability are not verified.'
      - name: Make room on runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install official GLUE 5 Android build toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: false
          cache_key_prefix: sn512a-v87-glue5-vulkan
      - name: Install tools from GLUE 5 project config
        run: |
          set -euo pipefail
          mise install rust cmake java gradle android-sdk cargo:cargo-ndk
      - name: V8.5 - Apply upstream wgpu-hal patches first, then adjust prepared Vulkan source
        env:
          POOL_POLICY: ${{ inputs.pool_policy }}
        run: |
          set -euo pipefail
          # FIX1: The earlier workflow edited patch 0003 before `mise run setup`.
          # Upstream patch 0013 relies on the ORIGINAL condition in patch 0003
          # as context, so it failed to apply (src/vulkan/command.rs:195).
          # Keep BOTH upstream patches pristine, apply all 0013 patches, THEN
          # adjust the already-patched Vulkan command encoder source directly.
          # The setup dependency of android:build uses an unchanged patch stamp,
          # therefore it reuses the prepared source instead of overwriting it.
          mkdir -p "$RUNNER_TEMP/v85-audit"
          git rev-parse HEAD | tee "$RUNNER_TEMP/v85-audit/upstream-commit.txt"
          echo "Selected pool policy: $POOL_POLICY" | tee "$RUNNER_TEMP/v85-audit/pool-policy.txt"
          git diff -- patches/wgpu-hal/ > "$RUNNER_TEMP/v85-audit/upstream-vulkan-patch-diff.txt"
          if [ -s "$RUNNER_TEMP/v85-audit/upstream-vulkan-patch-diff.txt" ]; then
            echo 'ERROR: upstream Vulkan patch files were already modified; refusing to continue.'
            exit 1
          fi
          # Apply GLUE5's entire tested, ordered patch stack WITHOUT edits.
          mise run setup
          code=third_party/wgpu-hal/src/vulkan/command.rs
          test -s "$code" || { echo 'Patched wgpu-hal command.rs is missing'; exit 1; }
          python3 - "$code" "$POOL_POLICY" "$RUNNER_TEMP/v85-audit" <<'PY_SN512A_V85_POOL'
          from pathlib import Path
          import hashlib
          import sys

          path, policy, report = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          assert policy in ('baseline', 'conservative'), policy
          original = path.read_text()
          # These markers come from GLUE5's upstream 0003 + 0013 patch stack.
          required = ('const REPLACE_AFTER: u32 = 8;',
                      'if self.slack >= REPLACE_AFTER {',
                      'self.device.retired_command_pools.lock().push(self.raw);')
          missing = [m for m in required if m not in original]
          if missing:
              raise SystemExit('GLUE5 upstream command pool patch stack changed: ' + repr(missing))
          old = 'if unused >= 4 && unused >= used {'
          new = 'if unused >= 12 && unused >= used.saturating_mul(3) {'
          if original.count(old) != 1 or new in original:
              raise SystemExit('Expected exactly one unmodified upstream Vulkan pool threshold; review source before patching')
          if policy == 'conservative':
              changed = original.replace(old, new, 1)
              path.write_text(changed)
              if path.read_text().count(new) != 1:
                  raise SystemExit('Conservative Vulkan change was not written')
              print('V8.5: once 12 spare buffers are available and >=3x last use, increment slack; retire pool after 8 repeated qualifying resets.')
          else:
              changed = original
              print('V8.5 baseline: no changes to upstream GLUE5 patched wgpu-hal source')
          (report / 'command-source-before.sha256').write_text(hashlib.sha256(original.encode()).hexdigest() + '\n')
          (report / 'command-source-after.sha256').write_text(hashlib.sha256(changed.encode()).hexdigest() + '\n')
          (report / 'vulkan-conditional.txt').write_text(new if policy == 'conservative' else old)
          PY_SN512A_V85_POOL
          grep -Fq 'const REPLACE_AFTER: u32 = 8;' "$code"
          if [ "$POOL_POLICY" = conservative ]; then
            grep -Fq 'if unused >= 12 && unused >= used.saturating_mul(3) {' "$code"
          else
            grep -Fq 'if unused >= 4 && unused >= used {' "$code"
          fi
          sha256sum "$code" | tee "$RUNNER_TEMP/v85-audit/wgpu-hal-command-sha256.txt"
          echo "V8.5 Vulkan mode: $POOL_POLICY" >> "$GITHUB_STEP_SUMMARY"
      - name: V8.5 - GPU completion lifetimes, safe memory pressure and Mali compute preflight
        env:
          SYNC_POLICY: ${{ inputs.sync_policy }}
          GPU_SOFT_BUDGET_MB: ${{ inputs.gpu_soft_budget_mb }}
        run: |
          set -euo pipefail
          python3 - <<'PY_SN512A_V85'
          from pathlib import Path
          import os, hashlib, json

          policy=os.environ['SYNC_POLICY']
          budget=int(os.environ['GPU_SOFT_BUDGET_MB'])
          if policy not in ('strict','baseline') or budget not in (640,704,768):
              raise SystemExit('Invalid V8.5 policy inputs')

          changes=[]
          def exact(rel, old, new, label):
              f=Path(rel)
              src=f.read_text()
              n=src.count(old)
              if n != 1:
                  raise SystemExit(f'V8.5 {label}: expected one source anchor, found {n} in {rel}. Stop before building')
              f.write_text(src.replace(old,new,1))
              changes.append({'file':rel,'change':label})

          # 1) GPU RESOURCE LIFETIME - in strict mode, drop objects only after their
          # submission's completion callback. Unlike the old 2-frame heuristic,
          # these retired wgpu handles cannot be freed before their GPU epoch finishes.
          # The kernel's device-loss fault is still unproven, so compare this with baseline.
          submit='crates/glue5-gpu/src/submit.rs'
          if policy=='strict':
              exact(submit, 'const FRAMES_IN_FLIGHT: usize = 2;', 'const FRAMES_IN_FLIGHT: usize = 1;', 'one in-flight frame')
              exact(submit, 'const PENDING: usize = 8;', 'const PENDING: usize = 4;', 'bounded pending batches')
              exact(submit, 'const ENCODE_THREADS: usize = 2;', 'const ENCODE_THREADS: usize = 1;', 'serialized GPU encoding')
              exact(submit,
                    '    let mut graves: Vec<Grave> = Vec::new();\n    let mut graves_frames = 0;',
                    '    let mut graves: VecDeque<(u64, Vec<Grave>)> = VecDeque::new();',
                    'per-epoch retired-resource queue')
              exact(submit,
                    '''        let (finished, epoch) = (finished.clone(), batch.epoch);
                  queue.on_submitted_work_done(move || {
                      finished.fetch_max(epoch, Ordering::Release);
                  });''',
                    '''        let finished_for_callback = finished.clone();
                  let epoch = batch.epoch;
                  queue.on_submitted_work_done(move || {
                      finished_for_callback.fetch_max(epoch, Ordering::Release);
                  });''',
                    'preserve the finished-epoch observable outside completion callback')
              exact(submit,
                    '''        graves.extend(batch.graves);
                  graves_frames += (batch.frame && !graves.is_empty()) as u32;
                  if !graves.is_empty() && (encoding.load(Ordering::Acquire) == 0 || graves_frames >= 2) {
                      let t = Instant::now();
                      graves.clear();
                      graves_frames = 0;
                      stats.release_ns.fetch_add(t.elapsed().as_nanos() as u64, Ordering::Relaxed);
                  }''',
                    '''        if !batch.graves.is_empty() {
                      graves.push_back((batch.epoch, batch.graves));
                  }
                  // Strict SN512A experiment: an engine object is no longer referenced
                  // by its D3D handle, but do not drop its wgpu handle until the GPU
                  // confirms it has finished that batch. Never call destroy() here.
                  let completed_epoch = finished.load(Ordering::Acquire);
                  let t_release = Instant::now();
                  let mut dropped = 0usize;
                  while graves.front().is_some_and(|(epoch, _)| *epoch <= completed_epoch) {
                      if let Some((_, retired)) = graves.pop_front() {
                          dropped += retired.len();
                      }
                  }
                  if dropped != 0 {
                      stats.release_ns.fetch_add(t_release.elapsed().as_nanos() as u64, Ordering::Relaxed);
                  }
                  if batch.epoch.is_multiple_of(256) {
                      log::info!("SN512A V8.5 GPU lifetimes: batch={} finished={} retired_batches={} released_objects={} encoding_jobs={}",
                          batch.epoch, completed_epoch, graves.len(), dropped, encoding.load(Ordering::Acquire));
                  }''',
                    'completion-fenced resource retirement and telemetry')

          # 2) GPU MEMORY PRESSURE - never destroy an active texture or buffer.
          # Reduce idle recycled cache size; trigger existing safe cache trimming when
          # the accounted active texture + buffer bytes pass a soft threshold.
          recycler='crates/glue5-gpu/src/recycle.rs'
          exact(recycler, 'const MAX_BYTES: u64 = 32 << 20;', 'const MAX_BYTES: u64 = 8 << 20;', 'reduce recycled GPU cache 32 -> 8 MiB')
          exact(recycler, 'const MAX_AGE: u64 = 1000;', 'const MAX_AGE: u64 = 256;', 'reduce retired cache lifetime')
          exec_file='crates/glue5-gpu/src/exec.rs'
          needle='        self.recycler.trim(self.epoch, &mut self.graveyard);'
          replacement=f'''        // V8.5 soft threshold: only throw away idle *recreatable* caches.
                  // Live allocations are never force-freed (would risk GPU use-after-free).
                  if self.epoch.is_multiple_of(1024) {{
                      let [tex, buf] = self.gpu_bytes();
                      let live = tex.saturating_add(buf);
                      log::info!("SN512A V8.5 GPU budget: live={{}}MiB of soft={{}}MiB, tex={{}}MiB buf={{}}MiB, objects={{}} epoch={{}}",
                          live >> 20, {budget}, tex >> 20, buf >> 20, self.objs.len(), self.epoch);
                      if live > ({budget}u64 << 20) {{
                          self.trim();
                      }}
                  }}
                  self.recycler.trim(self.epoch, &mut self.graveyard);'''
          exact(exec_file,needle,replacement,'soft GPU high-water trigger and stats')

          # 3) SHADER COMPATIBILITY - inspect compute workgroup size before creation.
          # An invalid 1024-thread pipeline on the 512-thread Mali had already been
          # rejected by wgpu validation; skip *only* statically provable unsupported
          # literal workgroups instead of attempting unsupported dispatches.
          ops='crates/glue5-gpu/src/ops.rs'
          needle='''    let layout = device
                  .create_bind_group_layout(&wgpu::BindGroupLayoutDescriptor { label: None, entries: &program.layout_entries() });'''
          replacement='''    // SN512A V8.5: GPU limit preflight, not a shader rewrite. Altering the
              // algorithm's 1024-thread workgroup to 512 would give incorrect results.
              let wgsl = program.text.get();
              if let Some(after) = wgsl.split("@workgroup_size(").nth(1)
                  && let Some(dims_text) = after.split(')').next()
              {
                  let mut dims = [1u32; 3];
                  let mut literal = true;
                  for (i, part) in dims_text.split(',').enumerate() {
                      if i >= 3 { literal = false; break; }
                      match part.trim().trim_end_matches('u').parse::<u32>() {
                          Ok(v) => dims[i] = v,
                          Err(_) => { literal = false; break; }
                      }
                  }
                  let lim = device.limits();
                  if literal && (dims[0] > lim.max_compute_workgroup_size_x
                      || dims[1] > lim.max_compute_workgroup_size_y
                      || dims[2] > lim.max_compute_workgroup_size_z
                      || (dims[0] as u64 * dims[1] as u64 * dims[2] as u64)
                          > lim.max_compute_invocations_per_workgroup as u64)
                  {
                      log::warn!("SN512A V8.5: skipped compute {} workgroup {:?}; device limits {:?}, max total {}",
                          program.label, dims,
                          [lim.max_compute_workgroup_size_x, lim.max_compute_workgroup_size_y, lim.max_compute_workgroup_size_z],
                          lim.max_compute_invocations_per_workgroup);
                      return None;
                  }
              }
              let layout = device
                  .create_bind_group_layout(&wgpu::BindGroupLayoutDescriptor { label: None, entries: &program.layout_entries() });'''
          exact(ops,needle,replacement,'unsupported WGSL compute workgroup filter')

          # Preserve the crash-time host log even after the app is restarted.
          # V8.2 normally renames host.log at next start, which can overwrite the only
          # record of the GPU loss; host-crash.log is a bounded <=4MiB frozen copy.
          exact('crates/glue5/src/sn512a_diag.rs',
                r'let _ = fs::write(dir.join("last-failure.txt"), format!("{reason}\n"));',
                r'let _ = fs::write(dir.join("last-failure.txt"), format!("{reason}\n"));' + '\n    let _ = fs::copy(dir.join("host.log"), dir.join("host-crash.log"));',
                'retain crash-time Vulkan error log across application restarts')

          checks=[
            ('crates/glue5-gpu/src/exec.rs','SN512A V8.5 GPU budget:'),
            ('crates/glue5-gpu/src/ops.rs','SN512A V8.5: skipped compute'),
            ('crates/glue5-gpu/src/recycle.rs','const MAX_BYTES: u64 = 8 << 20;'),
          ]
          if policy == 'strict':
              checks.append((submit,'SN512A V8.5 GPU lifetimes:'))
          for file,mark in checks:
              assert mark in Path(file).read_text(), f'patch not persisted: {file}'

          report = {
           'status':'UNCOMPILED SOURCE EXPERIMENT, NOT A CONFIRMED DEVICE-LOST FIX',
           'sync_policy':policy,'gpu_soft_budget_mb':budget,'changes':changes,
           'safety':'no force-deletion of active GPU objects, 768MiB resource heap remains a SOFT streaming target',
           'notes':'Unsupported literal compute workgroups skipped, not retiled; unknown game.wasm shader index remains unsupported.'}
          report_dir=Path(os.environ['RUNNER_TEMP'])/'v85-audit'
          report_dir.mkdir(exist_ok=True,parents=True)
          (report_dir/'resource-and-shader-patch.json').write_text(json.dumps(report,indent=2)+'\n')
          for file in [submit,recycler,exec_file,ops]:
              p=Path(file)
              (report_dir / (p.name+'.sha256')).write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          print(json.dumps(report,indent=2))
          PY_SN512A_V85
          git diff --check
          echo 'V8.5 GPU lifetime+memory+compute changes applied; full Android compilation is next.'
      - name: Save V8.5 source-change audit (without game files)
        uses: actions/upload-artifact@v4
        with:
          name: SN512A-V8.5-Vulkan-memory-shader-audit-${{ inputs.sync_policy }}
          path: ${{ runner.temp }}/v85-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Fix Mali packaging - require core libs, include Adreno hooks only when present
        run: |
          set -euo pipefail
          # GLUE 5's upstream packager blindly links five .so files. Our last
          # builds completed Rust compilation but failed to find optional
          # libadrenotools.so and libhook_impl.so. Mali-G57 uses system Vulkan.
          # Preserve core native libraries and only bundle AdrenoTools if its
          # three dynamically-loaded libraries were actually produced.
          python3 - <<'PY_SN512A_MALI_PACKAGE'
          from pathlib import Path
          p = Path('.mise/tasks/android/lib.sh')
          if not p.is_file():
              raise SystemExit('Missing GLUE 5 Android packaging script; source layout changed')
          src = p.read_text()
          old = '''    local lib
              for lib in glue5 SDL3 adrenotools hook_impl main_hook; do
                  ln -f "target/$target/release/lib$lib.so" "$out/jniLibs/$abi/"
              done'''
          new = '''    # SN512A/Mali: core runtime and SDL libraries are mandatory.
              # AdrenoTools is dynamically loaded only for a user-selected driver.
              local lib
              for lib in glue5 SDL3; do
                  if [ ! -s "target/$target/release/lib$lib.so" ]; then
                      die "Required Android library missing: lib$lib.so"
                  fi
                  ln -f "target/$target/release/lib$lib.so" "$out/jniLibs/$abi/"
              done
              local missing_optional=()
              for lib in adrenotools hook_impl main_hook; do
                  if [ ! -s "target/$target/release/lib$lib.so" ]; then
                      missing_optional+=("lib$lib.so")
                  fi
              done
              if [ ${#missing_optional[@]} -eq 0 ]; then
                  for lib in adrenotools hook_impl main_hook; do
                      ln -f "target/$target/release/lib$lib.so" "$out/jniLibs/$abi/"
                  done
                  echo "Optional AdrenoTools complete; bundled all three libraries."
              else
                  echo "Mali system-driver build: skipped incomplete optional AdrenoTools: ${missing_optional[*]}"
                  echo 'Custom Adreno driver selection is not available in this APK.'
              fi'''
          if src.count(old) != 1:
              raise SystemExit('Upstream Android library list changed; refusing an unverified modification')
          p.write_text(src.replace(old, new, 1))
          print('Fixed packager: core libraries required, optional AdrenoTools must be complete.')
          PY_SN512A_MALI_PACKAGE
          bash -n .mise/tasks/android/lib.sh
          git diff --check
          git diff -- .mise/tasks/android/lib.sh
          echo "GLUE 5 upstream commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: V8.6 - Profile actual Android CPU thread scheduling (no root or ADB)
        env:
          V86_ENCODER_WORKERS: ${{ inputs.encoder_workers }}
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v86.py <<'PY_V86'
          from pathlib import Path
          import os
          p=Path('crates/glue5/src/sn512a_diag.rs')
          src=p.read_text()
          anchor='log::info!("SN512A V8.2 diagnostics active; GPU errors mirrored to Android/data/local.glue5/files/logs/host.log");'
          if src.count(anchor)!=1:
              raise SystemExit('V8.5 diagnostic init anchor changed; no patch applied')
          src=src.replace(anchor,anchor+'\n                      sn512a_start_cpu_sampler();',1)
          # Android bionic defines _SC_CLK_TCK = 6 (do not use Linux/glibc's 2).
          sampler = r'''
          // V8.6: read our OWN process /proc/self/task/<tid>/stat every 10 seconds.
          // This uses no privileged process tracing. 'cpu' is the last scheduled
          // core at the snapshot, not proof the thread exclusively ran on that core.
          #[cfg(target_os = "android")]
          fn sn512a_cpu_snapshot() -> std::collections::HashMap<u32, (String, u64, u32)> {
              let mut tasks = std::collections::HashMap::new();
              let Ok(dir) = std::fs::read_dir("/proc/self/task") else { return tasks; };
              for entry in dir.flatten() {
                  let Some(tid) = entry.file_name().to_string_lossy().parse::<u32>().ok() else { continue };
                  let Ok(stat) = std::fs::read_to_string(entry.path().join("stat")) else { continue };
                  let Some(open) = stat.find('(') else { continue };
                  let Some(close) = stat.rfind(')') else { continue };
                  if close <= open { continue; }
                  let name = stat[open+1..close].replace(',', "_").replace('"', "_");
                  let rest: Vec<_> = stat[close+1..].split_whitespace().collect();
                  // Index 0 is Linux stat field 3 (state), utime/stime fields 14/15;
                  // processor field 39 is only a recent CPU-placement snapshot.
                  if rest.len() <= 36 { continue; }
                  let Some(utime) = rest[11].parse::<u64>().ok() else { continue; };
                  let Some(stime) = rest[12].parse::<u64>().ok() else { continue; };
                  let Some(cpu) = rest[36].parse::<u32>().ok() else { continue; };
                  tasks.insert(tid, (name, utime.saturating_add(stime), cpu));
              }
              tasks
          }

          #[cfg(target_os = "android")]
          fn sn512a_start_cpu_sampler() {
              let _ = std::thread::Builder::new().name("sn512a-cpu-probe".into()).spawn(|| {
                  use std::io::Write;
                  use std::time::{Duration, Instant};
                  #[link(name = "c")]
                  unsafe extern "C" { fn sysconf(name: std::os::raw::c_int) -> std::os::raw::c_long; }
                  const BIONIC_SC_CLK_TCK: std::os::raw::c_int = 6;
                  let hz = unsafe { sysconf(BIONIC_SC_CLK_TCK) };
                  let hz = if hz > 0 { hz as f64 } else { 100.0 };
                  let cores = std::thread::available_parallelism().map(|n| n.get()).unwrap_or(0);
                  let mut previous = sn512a_cpu_snapshot();
                  let mut previous_at = Instant::now();
                  let mut csv = log_dir().and_then(|d| std::fs::File::create(d.join("cpu-scheduler.csv")).ok());
                  if let Some(f) = csv.as_mut() {
                      let _ = f.write_all(b"elapsed_s,tid,thread,core_pct,last_cpu,live_threads\n");
                  }
                  log::info!("SN512A V8.6 CPU scheduler profiler started: available logical cores={cores}, clock_ticks_per_second={hz}, sample=10s; last_cpu is a snapshot, not affinity");
                  loop {
                      std::thread::sleep(Duration::from_secs(10));
                      let now = Instant::now();
                      let elapsed = now.duration_since(previous_at).as_secs_f64().max(0.001);
                      let current = sn512a_cpu_snapshot();
                      let mut rows: Vec<(u32, String, f64, u32)> = Vec::new();
                      for (&tid, (name, ticks, last_cpu)) in &current {
                          if let Some((_, old_ticks, _)) = previous.get(&tid) {
                              let delta = ticks.saturating_sub(*old_ticks);
                              if delta > 0 {
                                  let pct = 100.0 * (delta as f64) / (hz * elapsed);
                                  rows.push((tid, name.clone(), pct, *last_cpu));
                              }
                          }
                      }
                      rows.sort_by(|a,b| b.2.total_cmp(&a.2));
                      let sum_pct: f64 = rows.iter().map(|v| v.2).sum();
                      let top = rows.iter().take(8).map(|(tid,n,p,c)| format!("{tid}/{n}={p:.0}%@CPU{c}")).collect::<Vec<_>>().join(" | ");
                      log::info!("SN512A V8.6 CPU scheduler: logical_cores={cores}, threads={}, active_threads={}, process_cpu={sum_pct:.0}% (100%=one fully busy core), last_cpu snapshots; top: {top}", current.len(), rows.len());
                      if let Some(f) = csv.as_mut() {
                          for (tid,n,p,c) in &rows {
                              let _ = writeln!(f, "{elapsed:.3},{tid},{n},{p:.2},{c},{}", current.len());
                          }
                          let _ = f.flush();
                      }
                      previous = current;
                      previous_at = now;
                  }
              });
          }
          '''
          # Insert right before the failure handler, preserving the existing logger.
          marker='''/// Copy only the last 1 MiB of the private game.log after a failure.'''
          if src.count(marker)!=1:
              raise SystemExit('V8.5 diagnostic module marker changed; no patch applied')
          src=src.replace(marker,sampler+'\n'+marker,1)
          p.write_text(src)
          # Keep proven GPU epoch and queue settings UNCHANGED unless opt-in 2 workers.
          workers=int(os.environ['V86_ENCODER_WORKERS'])
          if workers not in (1,2): raise SystemExit('encoder_workers must be 1 or 2')
          submit=Path('crates/glue5-gpu/src/submit.rs')
          s=submit.read_text()
          tag='const ENCODE_THREADS: usize = 1;'
          if s.count(tag)!=1: raise SystemExit('strict V8.5 1-thread encoding not found: must select sync_policy=strict')
          if workers==2:
              submit.write_text(s.replace(tag,'const ENCODE_THREADS: usize = 2;',1))
          else:
              assert s.count(tag)==1
          print('V8.6 CPU profiler added; native encoder workers=', workers)
          print('NO changes to FRAMES_IN_FLIGHT=1, GPU completion lifetimes, cache policy, streaming budget or Vulkan command pools.')
          PY_V86
          python3 -m py_compile /tmp/sn512a_v86.py
          python3 /tmp/sn512a_v86.py
          grep -Fq 'fn sn512a_start_cpu_sampler()' crates/glue5/src/sn512a_diag.rs
          grep -Fq 'SN512A V8.6 CPU scheduler' crates/glue5/src/sn512a_diag.rs
          grep -Fq 'const FRAMES_IN_FLIGHT: usize = 1;' crates/glue5-gpu/src/submit.rs
          grep -Fq 'const PENDING: usize = 4;' crates/glue5-gpu/src/submit.rs
          git diff --check
          echo 'V8.6 CPU sampling builds on V8.5; Android/data/local.glue5/files/logs/cpu-scheduler.csv; no privileged Android features required.' >> "$GITHUB_STEP_SUMMARY"
      - name: V8.7 - CPU recording/state fastpaths + safe encoder worker A-B
        env:
          V87_FASTPATHS: ${{ inputs.cpu_fastpaths }}
          V87_WORKERS: ${{ inputs.encoder_workers }}
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v87.py <<'PY_V87'
          #!/usr/bin/env python3
          """V8.7 narrowly-scoped CPU optimization on top of V8.6 (GLUE5).
          
          1) Skip pipeline-dirty work when OM render targets have not changed.
          2) Keep a three-entry (VS/PS/CS) hot bind-group lookup cache. This DOES NOT
             bypass hash-map generation checks, after age or memory-pressure eviction.
          3) Optional second *CPU* command-encoding worker is applied by the V8.6 step.
          
          Never delete live resources; don't alter wgpu submissions, GPU epochs, frames in
          flight, command-pool policy, streaming/heap budget or shader compatibility.
          Fail closed if source no longer matches the previously inspected structure.
          """
          from pathlib import Path
          import hashlib, json, os
          
          on = os.environ['V87_FASTPATHS'].strip().lower()
          if on not in ('yes', 'no'):
              raise SystemExit('cpu_fastpaths must be yes or no')
          
          def replace_one(path:Path, old:str, new:str, label:str):
              s=path.read_text()
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Version mismatch in {path}, {label}: expected exactly 1 source anchor, found {count}')
              path.write_text(s.replace(old,new,1))
          
          results={'cpu_fastpaths':on,'worker_count':int(os.environ['V87_WORKERS']), 'changes': []}
          if results['worker_count'] not in (1,2): raise SystemExit('invalid encoder worker count')
          submit=Path('crates/glue5-gpu/src/submit.rs')
          submit_data=submit.read_text()
          for m in ['const FRAMES_IN_FLIGHT: usize = 1;',
                    'const PENDING: usize = 4;',
                    'SN512A V8.5 GPU lifetimes:']:
              if m not in submit_data:
                  raise SystemExit(f'Missing stable GPU synchronization invariant: {m}')
          if submit_data.count(f'const ENCODE_THREADS: usize = {results["worker_count"]};')!=1:
              raise SystemExit('Encoder worker setting missing; V8.6 patch did not apply')
          
          if on=='yes':
              # A safe D3D11 state-equivalence fast path: same RT IDs, subresources,
              # formats, depth flags => same pipeline. The original handler had no side
              # effects besides mutating these state fields + setting pdirty.
              execf=Path('crates/glue5-gpu/src/exec.rs')
              old='''            op::SET_RENDER_TARGETS => {
                          for i in 0..8 {
                              self.s.rt[i] =
                                  Target { tex: c.w(i * 4), mip: c.w(i * 4 + 1), slice: c.w(i * 4 + 2), format: c.w(i * 4 + 3) };
                          }
                          self.s.ds = Target { tex: c.w(32), mip: c.w(33), slice: c.w(34), format: c.w(35) };
                          self.s.ds_flags = c.w(36);
                          self.pdirty = true;
                      }'''
              new='''            op::SET_RENDER_TARGETS => {
                          // V8.7: the engine repeats OM target bindings frequently.
                          // Mark pipelines dirty only if attachment *identity* changes.
                          // No change to render-pass flush, hazards or GPU ordering.
                          let previous_rt = self.s.rt;
                          let previous_ds = self.s.ds;
                          let previous_flags = self.s.ds_flags;
                          for i in 0..8 {
                              self.s.rt[i] =
                                  Target { tex: c.w(i * 4), mip: c.w(i * 4 + 1), slice: c.w(i * 4 + 2), format: c.w(i * 4 + 3) };
                          }
                          self.s.ds = Target { tex: c.w(32), mip: c.w(33), slice: c.w(34), format: c.w(35) };
                          self.s.ds_flags = c.w(36);
                          if previous_rt != self.s.rt || previous_ds != self.s.ds || previous_flags != self.s.ds_flags {
                              self.pdirty = true;
                          } else {
                              self.stats.sn512a_redundant_rt += 1;
                          }
                      }'''
              replace_one(execf,old,new,'RT state equivalence')
              replace_one(execf,'    pub errors: u64,',
                         '    pub errors: u64,\n    /// V8.7: repeated identical OM bindings that did not dirty a pipeline.\n    pub sn512a_redundant_rt: u64,',
                         'render-target fast-path telemetry')
              results['changes']+=['deduplicate identical SET_RENDER_TARGETS without changing render pass/attachment IDs']
          
              # Source in GLUE5 has already cached all the expensive wgpu handles in
              # two generations. This avoids repeated FxHashMap hashing on *identical*
              # groups when VS/PS/CS alternate within a draw. Invalidate hot handles on
              # generation rotation or pressure release so stale resources aren't pinned.
              draw=Path('crates/glue5-gpu/src/draw.rs')
              replace_one(draw,'''pub struct BindCache {
              current: ''','''pub struct BindCache {
              // SN512A V8.7: one frequently repeated group per shader stage.
              // Cleared whenever bind-group generations are recycled/evicted.
              hot: [Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 3],
              pub sn512a_hot_hits: u64,
              pub sn512a_hot_lookups: u64,
              current: ''','hot bind group fields')
              old='''    fn get(&mut self, key: &[u32]) -> Option<(wgpu::BindGroup, u64)> {
                  if let Some(v) = self.current.get(key) {
                      return Some(v.clone());
                  }
                  let (k, v) = self.old.remove_entry(key)?;
                  self.current.insert(k, v.clone());
                  Some(v)
              }'''
              new='''    fn get(&mut self, key: &[u32]) -> Option<(wgpu::BindGroup, u64)> {
                  // All texture/sampler groups begin with (program ID, shader stage).
                  // Keep the stage-specific hot lookup only as long as its generation.
                  let stage = key.get(1).copied().unwrap_or(3) as usize;
                  self.sn512a_hot_lookups += 1;
                  if let Some(Some((hot_key, bg, serial))) = self.hot.get(stage) {
                      if hot_key.as_ref() == key {
                          self.sn512a_hot_hits += 1;
                          return Some((bg.clone(), *serial));
                      }
                  }
                  let found = if let Some(v) = self.current.get(key) {
                      Some(v.clone())
                  } else {
                      let (k, v) = self.old.remove_entry(key)?;
                      self.current.insert(k, v.clone());
                      Some(v)
                  };
                  if let Some((bg, serial)) = &found {
                      if let Some(slot) = self.hot.get_mut(stage) {
                          *slot = Some((key.into(), bg.clone(), *serial));
                      }
                  }
                  found
              }'''
              replace_one(draw,old,new,'fast bind cache lookups')
              # When aging drops a previous cache generation, forget its hot handles too.
              replace_one(draw,
                 '    pub fn age(&mut self) -> BindGroups {\n        std::mem::replace(&mut self.old, std::mem::take(&mut self.current))',
                 '    pub fn age(&mut self) -> BindGroups {\n        self.hot = Default::default();\n        std::mem::replace(&mut self.old, std::mem::take(&mut self.current))',
                 'age cache invalidation')
              replace_one(draw,
                 '    pub fn take_old(&mut self) -> BindGroups {\n        std::mem::take(&mut self.old)',
                 '    pub fn take_old(&mut self) -> BindGroups {\n        self.hot = Default::default();\n        std::mem::take(&mut self.old)',
                 'pressure cache invalidation')
              old='''        self.serial += 1;
                  self.current.insert(key.into(), (bg, self.serial));'''
              new='''        self.serial += 1;
                  if dropped.is_some() { self.hot = Default::default(); }
                  if let Some(slot) = self.hot.get_mut(key.get(1).copied().unwrap_or(3) as usize) {
                      *slot = Some((key.into(), bg.clone(), self.serial));
                  }
                  self.current.insert(key.into(), (bg, self.serial));'''
              replace_one(draw,old,new,'new bind cache inserts + promotion invalidation')
              results['changes']+=['stage-specific hot bind cache, invalidated on age/memory pressure']
          
              # Report whether the fast paths *actually* help rather than claiming FPS.
              # Insert into the existing V8.5 periodic GPU-budget diagnostic; all fields
              # are owned by self, and reading them doesn't require thread synchronization.
              # Only the one V8.5 flush-site exists; use its exact indentation.
              text=execf.read_text()
              actual='        self.recycler.trim(self.epoch, &mut self.graveyard);'
              if text.count(actual)!=1: raise SystemExit('V8.5 recycler trim anchor missing')
              performance='''        if self.epoch.is_multiple_of(1024) {
                      log::info!("SN512A V8.7 CPU fastpaths: redundant_rt={} hot_groups={}/{}",
                          self.stats.sn512a_redundant_rt,
                          self.binds.sn512a_hot_hits, self.binds.sn512a_hot_lookups);
                  }
                  self.recycler.trim(self.epoch, &mut self.graveyard);'''
              replace_one(execf, actual, performance, 'CPU fastpaths diagnostics')
              results['changes']+=['periodic measured fast-path hit counts in host.log']
          
          results['changes'].append('encoder worker count selected in V8.6, GPU completion fences and strict in-flight frame cap retained')
          checks={'crates/glue5-gpu/src/submit.rs':['const FRAMES_IN_FLIGHT: usize = 1;',
                                                    'const PENDING: usize = 4;',
                                                    'SN512A V8.5 GPU lifetimes:'],
                  'crates/glue5-gpu/src/ops.rs':['SN512A V8.5: skipped compute'],
                  'crates/glue5-gpu/src/recycle.rs':['const MAX_BYTES: u64 = 8 << 20;'],
                  'crates/glue5-gpu/src/exec.rs':['SN512A V8.5 GPU budget:']}
          if on=='yes':
              checks['crates/glue5-gpu/src/draw.rs']=['SN512A V8.7: one frequently repeated group', 'self.hot = Default::default();']
              checks['crates/glue5-gpu/src/exec.rs']+=['SN512A V8.7 CPU fastpaths:', 'sn512a_redundant_rt']
          for f,marks in checks.items():
              data=Path(f).read_text()
              for m in marks:
                  if m not in data: raise SystemExit(f'Missing post-patch invariant in {f}: {m}')
          
          report=Path(os.environ['RUNNER_TEMP'])/'v85-audit'
          report.mkdir(parents=True,exist_ok=True)
          (report/'v87-cpu-patch-report.json').write_text(json.dumps(results,indent=2)+'\n')
          for name in ['crates/glue5-gpu/src/draw.rs','crates/glue5-gpu/src/exec.rs','crates/glue5-gpu/src/submit.rs']:
              p=Path(name)
              (report/(p.name+'.v87.sha256')).write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          print(json.dumps(results,indent=2))
          PY_V87
          python3 -m py_compile /tmp/sn512a_v87.py
          python3 /tmp/sn512a_v87.py
          git diff --check
          git diff -- crates/glue5-gpu/src/submit.rs crates/glue5-gpu/src/exec.rs crates/glue5-gpu/src/draw.rs > "$RUNNER_TEMP/v85-audit/v87-graphics-cpu-changes.patch"
          grep -Fq 'SN512A V8.5 GPU lifetimes:' crates/glue5-gpu/src/submit.rs
          grep -Fq 'SN512A V8.5: skipped compute' crates/glue5-gpu/src/ops.rs
          echo "V8.7: CPU fastpaths=${{ inputs.cpu_fastpaths }}; encoder workers=${{ inputs.encoder_workers }}; strict GPU synchronization still enabled." >> "$GITHUB_STEP_SUMMARY"
      - name: Save V8.7 CPU patches and source provenance (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: SN512A-V8.7-CPU-patch-audit-${{ inputs.cpu_fastpaths }}-${{ inputs.encoder_workers }}
          path: ${{ runner.temp }}/v85-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Set up release signing key (preserve it for future updates)
        run: |
          set -euo pipefail
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          cd ~/.android
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" get '${{ steps.game.outputs.release }}' Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE/glue5" exec -- keytool -genkeypair -noprompt \
              -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=SN512A V8 Debug,O=Android,C=US'
          fi
      - name: Compile GLUE 5 Android AOT game and app
        env:
          # Official GLUE 5 build script explicitly permits an unknown build in
          # experimental mode. Hook resolution can fail if code differs.
          GLUE5_ALLOW_UNKNOWN_BUILD: '1'
        run: |
          set -euo pipefail
          mise run android:build
          test -s target/android/gradle/outputs/apk/release/Glue5-release.apk
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk "$RUNNER_TEMP/Glue5-android.apk"
          cp ~/.android/debug.keystore "$RUNNER_TEMP/Glue5-android.keystore"
          # Confirm that the three mandatory JNI libraries are actually in
          # the signed APK. Missing optional AdrenoTools are acceptable on Mali.
          python3 - "$RUNNER_TEMP/Glue5-android.apk" <<'PY_APK_CHECK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              required = {f'lib/arm64-v8a/{name}' for name in
                          ('libglue5.so', 'libSDL3.so', 'libc++_shared.so')}
              absent = sorted(required - names)
              if absent:
                  raise SystemExit('Signed APK missing mandatory JNI libraries: ' + ', '.join(absent))
              print('Verified: GLUE 5, SDL3 and libc++ JNI libraries are in signed APK')
          PY_APK_CHECK
          sha256sum "$RUNNER_TEMP/Glue5-android.apk"
      - name: Keep an additional downloadable signed APK in this Actions run (private)
        uses: actions/upload-artifact@v4
        with:
          name: SN512A-GLUE5-V8.7-CPU-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}-signed-APK
          path: ${{ runner.temp }}/Glue5-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Keep signed test APK private in the SAME DRAFT release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cp Glue5-android.apk Glue5-android-V8.7-CPU-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" upload '${{ steps.game.outputs.release }}' Glue5-android-V8.7-CPU-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          echo 'V8.7 CPU fastpath + encoder-worker A/B experiment. Preserves the strict V8.5 lifetime guards, 768MiB streaming budget, expanded graphics menu, and CPU scheduler diagnostics. To A/B isolate changes, run cpu_fastpaths=no with encoder_workers=1. Log: logs/cpu-scheduler.csv and host.log.' >> "$GITHUB_STEP_SUMMARY"
