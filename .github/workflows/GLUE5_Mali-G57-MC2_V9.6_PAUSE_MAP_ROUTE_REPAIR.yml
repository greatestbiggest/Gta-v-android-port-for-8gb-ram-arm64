          //! SN512A: mirror existing GLUE 5 diagnostics to the user's PUBLIC Documents folder.
          //! Android 10+ scoped storage: MediaStore.Files + RELATIVE_PATH, never raw
          //! /storage/emulated/0 writes, MANAGE_EXTERNAL_STORAGE, root, or ADB.
          //! Session-specific names preserve earlier crash reports after relaunch.
          use std::fs::{self, File};
          use std::io::{Read, Seek, SeekFrom, Write};
          use std::os::fd::FromRawFd;
          use std::sync::{Mutex, OnceLock};
          use std::time::{SystemTime, UNIX_EPOCH};
          use jni::objects::{JObject, JValue};
          use jni::JNIEnv;

          const DIR: &str = "Documents/GLUE5-Logs/";
          const GAME_TAIL_LIMIT: u64 = 1024 * 1024;

          #[link(name = "SDL3")]
          unsafe extern "C" {
              fn SDL_GetAndroidJNIEnv() -> *mut std::ffi::c_void;
              fn SDL_GetAndroidActivity() -> *mut std::ffi::c_void;
          }
          unsafe extern "C" {
              fn dup(fd: std::os::raw::c_int) -> std::os::raw::c_int;
          }

          struct PublicFiles {
              host: Option<File>,
              cpu: Option<File>,
              reason: Option<File>,
              tail: Option<File>,
              crash: Option<File>,
              previous: Option<File>,
          }
          static FILES: OnceLock<Mutex<PublicFiles>> = OnceLock::new();

          fn put_string<'a>(env: &mut JNIEnv<'a>, values: &JObject<'a>, key: &str, value: &str) -> Result<(), String> {
              let k = JObject::from(env.new_string(key).map_err(|e| e.to_string())?);
              let v = JObject::from(env.new_string(value).map_err(|e| e.to_string())?);
              env.call_method(values, "put", "(Ljava/lang/String;Ljava/lang/String;)V",
                  &[JValue::Object(&k), JValue::Object(&v)])
                  .map_err(|e| format!("ContentValues.put({key}): {e}"))?;
              Ok(())
          }

          fn create<'a>(env: &mut JNIEnv<'a>, resolver: &JObject<'a>, collection: &JObject<'a>, filename: &str) -> Result<File, String> {
              let values = env.new_object("android/content/ContentValues", "()V", &[])
                  .map_err(|e| e.to_string())?;
              put_string(env, &values, "_display_name", filename)?;
              put_string(env, &values, "mime_type", if filename.ends_with(".csv") { "text/csv" } else { "text/plain" })?;
              put_string(env, &values, "relative_path", DIR)?;
              let uri = env.call_method(resolver, "insert", "(Landroid/net/Uri;Landroid/content/ContentValues;)Landroid/net/Uri;",
                  &[JValue::Object(collection), JValue::Object(&values)])
                  .map_err(|e| format!("MediaStore insert {filename}: {e}"))?
                  .l().map_err(|e| e.to_string())?;
              if uri.is_null() { return Err(format!("MediaStore returned null for {filename}")); }
              let mode = JObject::from(env.new_string("w").map_err(|e| e.to_string())?);
              let pfd = env.call_method(resolver, "openFileDescriptor", "(Landroid/net/Uri;Ljava/lang/String;)Landroid/os/ParcelFileDescriptor;",
                  &[JValue::Object(&uri), JValue::Object(&mode)])
                  .map_err(|e| format!("MediaStore open {filename}: {e}"))?
                  .l().map_err(|e| e.to_string())?;
              if pfd.is_null() { return Err(format!("MediaStore returned null descriptor for {filename}")); }
              let java_fd = env.call_method(&pfd, "getFd", "()I", &[])
                  .and_then(|v| v.i()).map_err(|e| e.to_string())?;
              // Dup BEFORE closing the Java ParcelFileDescriptor. Rust owns only the dup.
              let own_fd = unsafe { dup(java_fd) };
              let _ = env.call_method(&pfd, "close", "()V", &[]);
              if own_fd < 0 { return Err(format!("dup(MediaStore fd) failed for {filename}")); }
              Ok(unsafe { File::from_raw_fd(own_fd) })
          }

          pub(crate) fn init() {
              // Called on the SDL-initialized Android UI/game thread, not from a detached
              // sampler thread. SDL supplies an already-attached JNIEnv and Activity.
              let result: Result<(PublicFiles, String), String> = (|| {
                  let env_ptr = unsafe { SDL_GetAndroidJNIEnv() };
                  let act_ptr = unsafe { SDL_GetAndroidActivity() };
                  if env_ptr.is_null() || act_ptr.is_null() { return Err("SDL JNI/activity unavailable".into()); }
                  let mut env = unsafe { JNIEnv::from_raw(env_ptr.cast()) }.map_err(|e| e.to_string())?;
                  let activity = unsafe { JObject::from_raw(act_ptr.cast()) };
                  let resolver = env.call_method(&activity, "getContentResolver", "()Landroid/content/ContentResolver;", &[])
                      .map_err(|e| format!("getContentResolver: {e}"))?
                      .l().map_err(|e| e.to_string())?;
                  // SDL_GetAndroidActivity returns a local reference: release our copy.
                  env.delete_local_ref(activity).map_err(|e| e.to_string())?;
                  let volume = JObject::from(env.new_string("external_primary").map_err(|e| e.to_string())?);
                  let collection = env.call_static_method("android/provider/MediaStore$Files", "getContentUri",
                      "(Ljava/lang/String;)Landroid/net/Uri;", &[JValue::Object(&volume)])
                      .map_err(|e| format!("MediaStore.Files.getContentUri: {e}"))?
                      .l().map_err(|e| e.to_string())?;
                  let session = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_secs();
                  let prefix = format!("SN512A-{session}");
                  let mut file = |suffix: &str| -> Option<File> {
                      let name = format!("{prefix}-{suffix}");
                      match create(&mut env, &resolver, &collection, &name) {
                          Ok(f) => Some(f),
                          Err(e) => { eprintln!("SN512A public Documents export: {e}"); None }
                      }
                  };
                  let mut docs = PublicFiles {
                      host: file("host.log"),
                      cpu: file("cpu-scheduler.csv"),
                      reason: file("last-failure.txt"),
                      tail: file("game-tail.log"),
                      crash: file("host-crash.log"),
                      previous: file("host-previous.log"),
                  };
                  if docs.host.is_none() || docs.cpu.is_none() {
                      return Err("could not create host.log and cpu-scheduler.csv in Documents".into());
                  }
                  let mut readme = file("README.txt");
                  if let Some(f) = readme.as_mut() {
                      let _ = writeln!(f, "SN512A GLUE 5 session {session}");
                      let _ = writeln!(f, "Public folder: {DIR}");
                      let _ = writeln!(f, "All session files share prefix {prefix}-");
                      let _ = writeln!(f, "host.log: live GPU and engine log; cpu-scheduler.csv: 10-second thread snapshots");
                      let _ = writeln!(f, "game-tail.log: latest 1 MiB of game.log (updated every 60 s and upon failure)");
                      let _ = writeln!(f, "last-failure.txt / host-crash.log: filled if game reports an error");
                      let _ = writeln!(f, "Never upload your private game.wasm or 20 GB game assets.");
                      let _ = f.flush();
                  }
                  // Carry over the previous run's last host log if available.
                  if let Some(dst) = docs.previous.as_mut() {
                      if let Some(root) = crate::paths::android_external_dir() {
                          if let Ok(mut src) = File::open(root.join("logs/host-previous.log")) {
                              let _ = std::io::copy(&mut src, dst);
                              let _ = dst.flush();
                          }
                      }
                  }
                  Ok((docs, prefix))
              })();
              match result {
                  Ok((files, name)) => {
                      let _ = FILES.set(Mutex::new(files));
                      // Before the main logger is initialized, write only to logcat/stderr.
                      eprintln!("SN512A Documents export ACTIVE: {DIR} prefix {name}");
                  }
                  Err(e) => {
                      eprintln!("SN512A Documents export UNAVAILABLE ({e}); app-private logging remains active");
                  }
              }
          }

          pub(crate) fn enabled() -> bool { FILES.get().is_some() }

          pub(crate) fn host(line: &str) {
              if let Some(files) = FILES.get() {
                  if let Ok(mut docs) = files.lock() {
                      if let Some(f) = docs.host.as_mut() {
                          let _ = f.write_all(line.as_bytes());
                          let _ = f.flush(); // Preserve the error even on an abrupt GPU failure.
                      }
                  }
              }
          }

          pub(crate) fn cpu(bytes: &[u8]) {
              if let Some(files) = FILES.get() {
                  if let Ok(mut docs) = files.lock() {
                      if let Some(f) = docs.cpu.as_mut() {
                          let _ = f.write_all(bytes);
                          let _ = f.flush();
                      }
                  }
              }
          }

          pub(crate) fn snapshot_game_tail() {
              let Some(files) = FILES.get() else { return; };
              let Ok(user_dir) = crate::paths::user_dir() else { return; };
              let Ok(mut src) = File::open(user_dir.join("game.log")) else { return; };
              let Ok(len) = src.metadata().map(|m| m.len()) else { return; };
              if src.seek(SeekFrom::Start(len.saturating_sub(GAME_TAIL_LIMIT))).is_err() { return; }
              if let Ok(mut docs) = files.lock() {
                  if let Some(dst) = docs.tail.as_mut() {
                      // Only this bounded snapshot is exposed. Do not copy 20 GB assets.
                      if dst.set_len(0).is_err() || dst.seek(SeekFrom::Start(0)).is_err() { return; }
                      let _ = std::io::copy(&mut src.take(GAME_TAIL_LIMIT), dst);
                      let _ = dst.flush();
                  }
              }
          }

          pub(crate) fn failed(reason: &str) {
              snapshot_game_tail();
              let Some(files) = FILES.get() else { return; };
              let Ok(mut docs) = files.lock() else { return; };
              if let Some(f) = docs.reason.as_mut() {
                  let _ = writeln!(f, "{reason}");
                  let _ = f.flush();
              }
              let Some(root) = crate::paths::android_external_dir() else { return; };
              if let Ok(mut src) = File::open(root.join("logs/host.log")) {
                  if let Some(f) = docs.crash.as_mut() {
                      let _ = std::io::copy(&mut src, f);
                      let _ = f.flush();
                  }
              }
          }
          RUST_SN512A_PUBLIC_DOCS
          grep -Fq 'jni = { version = "0.21"' crates/glue5/Cargo.toml
          grep -Fq 'SN512A V8.7 R2 PUBLIC' crates/glue5/src/sn512a_diag.rs
          grep -Fq 'MediaStore$Files' crates/glue5/src/sn512a_public_docs.rs
          git diff --check
          echo 'V8.7 R2: live host/CPU logs and bounded game-tail/crash data copied to public Documents/GLUE5-Logs via MediaStore, without root, ADB, or storage permission. App-private logs remain.' >> "$GITHUB_STEP_SUMMARY"
      - name: V8.7 - CPU recording/state fastpaths + safe encoder worker A-B
        env:
          V87_FASTPATHS: ${{ inputs.cpu_fastpaths }}
          V87_WORKERS: ${{ inputs.encoder_workers }}
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v87.py <<'PY_V87'
          #!/usr/bin/env python3
          """V8.7 narrowly-scoped CPU optimization on top of V8.6 (GLUE5).
          
          1) Skip pipeline-dirty work when OM render targets have not changed.
          2) Keep a three-entry (VS/PS/CS) hot bind-group lookup cache. This DOES NOT
             bypass hash-map generation checks, after age or memory-pressure eviction.
          3) Optional second *CPU* command-encoding worker is applied by the V8.6 step.
          
          Never delete live resources; don't alter wgpu submissions, GPU epochs, frames in
          flight, command-pool policy, streaming/heap budget or shader compatibility.
          Fail closed if source no longer matches the previously inspected structure.
          """
          from pathlib import Path
          import hashlib, json, os
          
          on = os.environ['V87_FASTPATHS'].strip().lower()
          if on not in ('yes', 'no'):
              raise SystemExit('cpu_fastpaths must be yes or no')
          
          def replace_one(path:Path, old:str, new:str, label:str):
              s=path.read_text()
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Version mismatch in {path}, {label}: expected exactly 1 source anchor, found {count}')
              path.write_text(s.replace(old,new,1))
          
          results={'cpu_fastpaths':on,'worker_count':int(os.environ['V87_WORKERS']), 'changes': []}
          if results['worker_count'] not in (1,2): raise SystemExit('invalid encoder worker count')
          submit=Path('crates/glue5-gpu/src/submit.rs')
          submit_data=submit.read_text()
          for m in ['const FRAMES_IN_FLIGHT: usize = 1;',
                    'const PENDING: usize = 4;',
                    'SN512A V8.5 GPU lifetimes:']:
              if m not in submit_data:
                  raise SystemExit(f'Missing stable GPU synchronization invariant: {m}')
          if submit_data.count(f'const ENCODE_THREADS: usize = {results["worker_count"]};')!=1:
              raise SystemExit('Encoder worker setting missing; V8.6 patch did not apply')
          
          if on=='yes':
              # A safe D3D11 state-equivalence fast path: same RT IDs, subresources,
              # formats, depth flags => same pipeline. The original handler had no side
              # effects besides mutating these state fields + setting pdirty.
              execf=Path('crates/glue5-gpu/src/exec.rs')
              old='''            op::SET_RENDER_TARGETS => {
                          for i in 0..8 {
                              self.s.rt[i] =
                                  Target { tex: c.w(i * 4), mip: c.w(i * 4 + 1), slice: c.w(i * 4 + 2), format: c.w(i * 4 + 3) };
                          }
                          self.s.ds = Target { tex: c.w(32), mip: c.w(33), slice: c.w(34), format: c.w(35) };
                          self.s.ds_flags = c.w(36);
                          self.pdirty = true;
                      }'''
              new='''            op::SET_RENDER_TARGETS => {
                          // V8.7: the engine repeats OM target bindings frequently.
                          // Mark pipelines dirty only if attachment *identity* changes.
                          // No change to render-pass flush, hazards or GPU ordering.
                          let previous_rt = self.s.rt;
                          let previous_ds = self.s.ds;
                          let previous_flags = self.s.ds_flags;
                          for i in 0..8 {
                              self.s.rt[i] =
                                  Target { tex: c.w(i * 4), mip: c.w(i * 4 + 1), slice: c.w(i * 4 + 2), format: c.w(i * 4 + 3) };
                          }
                          self.s.ds = Target { tex: c.w(32), mip: c.w(33), slice: c.w(34), format: c.w(35) };
                          self.s.ds_flags = c.w(36);
                          if previous_rt != self.s.rt || previous_ds != self.s.ds || previous_flags != self.s.ds_flags {
                              self.pdirty = true;
                          } else {
                              self.stats.sn512a_redundant_rt += 1;
                          }
                      }'''
              replace_one(execf,old,new,'RT state equivalence')
              replace_one(execf,'    pub errors: u64,',
                         '    pub errors: u64,\n    /// V8.7: repeated identical OM bindings that did not dirty a pipeline.\n    pub sn512a_redundant_rt: u64,',
                         'render-target fast-path telemetry')
              results['changes']+=['deduplicate identical SET_RENDER_TARGETS without changing render pass/attachment IDs']
          
              # Source in GLUE5 has already cached all the expensive wgpu handles in
              # two generations. This avoids repeated FxHashMap hashing on *identical*
              # groups when VS/PS/CS alternate within a draw. Invalidate hot handles on
              # generation rotation or pressure release so stale resources aren't pinned.
              draw=Path('crates/glue5-gpu/src/draw.rs')
              replace_one(draw,'''pub struct BindCache {
              current: ''','''pub struct BindCache {
              // SN512A V8.7: one frequently repeated group per shader stage.
              // Cleared whenever bind-group generations are recycled/evicted.
              hot: [Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 3],
              pub sn512a_hot_hits: u64,
              pub sn512a_hot_lookups: u64,
              current: ''','hot bind group fields')
              old='''    fn get(&mut self, key: &[u32]) -> Option<(wgpu::BindGroup, u64)> {
                  if let Some(v) = self.current.get(key) {
                      return Some(v.clone());
                  }
                  let (k, v) = self.old.remove_entry(key)?;
                  self.current.insert(k, v.clone());
                  Some(v)
              }'''
              new='''    fn get(&mut self, key: &[u32]) -> Option<(wgpu::BindGroup, u64)> {
                  // All texture/sampler groups begin with (program ID, shader stage).
                  // Keep the stage-specific hot lookup only as long as its generation.
                  let stage = key.get(1).copied().unwrap_or(3) as usize;
                  self.sn512a_hot_lookups += 1;
                  if let Some(Some((hot_key, bg, serial))) = self.hot.get(stage) {
                      if hot_key.as_ref() == key {
                          self.sn512a_hot_hits += 1;
                          return Some((bg.clone(), *serial));
                      }
                  }
                  let found = if let Some(v) = self.current.get(key) {
                      Some(v.clone())
                  } else {
                      let (k, v) = self.old.remove_entry(key)?;
                      self.current.insert(k, v.clone());
                      Some(v)
                  };
                  if let Some((bg, serial)) = &found {
                      if let Some(slot) = self.hot.get_mut(stage) {
                          *slot = Some((key.into(), bg.clone(), *serial));
                      }
                  }
