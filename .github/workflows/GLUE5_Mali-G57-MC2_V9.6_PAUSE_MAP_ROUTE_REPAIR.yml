      - name: V9.3 - Finish upload and render encoders on dedicated CPU workers, ordered GPU submission
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v93_upload_encoder.py <<'PY_SN512A_V93'
          from pathlib import Path
          import hashlib, json, os
          submit = Path('crates/glue5-gpu/src/submit.rs')
          exec_rs = Path('crates/glue5-gpu/src/exec.rs')
          def exact(path, old, new, label):
              s=path.read_text()
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'ABORT V9.3 ({label}): anchor appears {n} times instead of 1 in {path}; upstream may have changed')
              path.write_text(s.replace(old,new,1))
          # Underlying renderer still has exactly one batch-finishing worker.
          s=submit.read_text()
          for expected in ('const FRAMES_IN_FLIGHT: usize = 1;',
                           'const PENDING: usize = 4;',
                           'const ENCODE_THREADS: usize = 1;',
                           'SN512A V8.5 GPU lifetimes:'):
              if expected not in s:
                  raise SystemExit('ABORT V9.3: original strict single render-worker behavior changed: '+expected)
          # The first encoder in the batch is the separate upload encoder supplied by Uploads::finish().
          exact(exec_rs,
              '        let (uploads, staging) = self.uploads.finish();\n        let mut encoders = uploads.into_iter().chain(self.encoder.take()).collect();',
              '        let (uploads, staging) = self.uploads.finish();\n        let upload_encoder_count = usize::from(uploads.is_some());\n        let mut encoders = uploads.into_iter().chain(self.encoder.take()).collect();',
              'identify existing first upload encoder')
          exact(exec_rs,
              '        self.submitter.send(crate::submit::Batch {\n            encoders,\n            staging,',
              '        self.submitter.send(crate::submit::Batch {\n            encoders,\n            upload_encoder_count,\n            staging,',
              'pass upload count to submit worker')
          exact(submit,
              '    pub encoders: Vec<wgpu::CommandEncoder>,\n    /// Staging chunks the uploads copy from.',
              '    pub encoders: Vec<wgpu::CommandEncoder>,\n    /// The first encoder, when present, contains staged buffer/texture copy commands.\n    pub upload_encoder_count: usize,\n    /// Staging chunks the uploads copy from.',
              'remember upload encoder position')
          exact(submit,
              'type Encoded = Receiver<Vec<wgpu::CommandBuffer>>;',
              'type Encoded = (Receiver<Vec<wgpu::CommandBuffer>>, Receiver<Vec<wgpu::CommandBuffer>>);',
              'two independently encoded ordered results')
          exact(submit,
              'pub struct Submitter {\n    jobs: Sender<Job>,\n    batches: SyncSender<(Batch, Encoded)>,',
              'pub struct Submitter {\n    jobs: Sender<Job>,\n    upload_jobs: Sender<Job>,\n    batches: SyncSender<(Batch, Encoded)>,',
              'add dedicated upload command-finishing worker')
          # Keep the original render-finishing worker loop and all fences untouched.
          # The upload worker receives ONLY the upload encoder(s), never render chunks.
          anchor='''        let (batches, rx) = sync_channel(PENDING);'''
          addition='''        // SN512A V9.3: one independent upload-encoder finishing lane.\n        // It does not move texture-buffer writes, only CommandEncoder::finish.\n        let (upload_jobs, upload_rx) = channel::<Job>();\n        let (upload_stats, upload_encoding) = (stats.clone(), encoding.clone());\n        std::thread::Builder::new()\n            .name("gpu encode uploads".into())\n            .spawn(move || {\n                glue5_runtime::qos::set(glue5_runtime::qos::Qos::Interactive);\n                while let Ok((encoders, back)) = upload_rx.recv() {\n                    let t = Instant::now();\n                    let buffers: Vec<_> = encoders.into_iter().map(|e| e.finish()).collect();\n                    upload_encoding.fetch_sub(1, Ordering::Release);\n                    upload_stats.encode_ns.fetch_add(t.elapsed().as_nanos() as u64, Ordering::Relaxed);\n                    let _ = back.send(buffers);\n                }\n            })\n            .expect("spawning a GPU upload encoding thread");\n        log::info!("SN512A V9.3 DEDICATED_UPLOAD_FINISH: render_workers=1 upload_workers=1 GPU_queue=1 ordered_submit=true strict_epoch_fences=true");\n'''
          exact(submit,anchor,addition+anchor,'start dedicated upload finishing worker')
          exact(submit,
              '        Submitter { jobs, batches, encoding, stats }',
              '        Submitter { jobs, upload_jobs, batches, encoding, stats }',
              'store upload-job sender')
          old_send='''    pub fn send(&self, mut batch: Batch) {\n        let (back, encoded) = channel();\n        let encoders = std::mem::take(&mut batch.encoders);\n        if encoders.is_empty() {\n            let _ = back.send(Vec::new());\n        } else {\n            self.encoding.fetch_add(1, Ordering::Release);\n            let _ = self.jobs.send((encoders, back));\n        }\n        let _ = self.batches.send((batch, encoded));\n    }'''
          new_send='''    pub fn send(&self, mut batch: Batch) {\n        // The original first encoder records uploads. Finish that encoder on a\n        // separate CPU worker; do not submit or recycle staging out of order.\n        let mut encoders = std::mem::take(&mut batch.encoders);\n        assert!(batch.upload_encoder_count <= 1 && batch.upload_encoder_count <= encoders.len(),\n                "V9.3 batch upload-encoder count must be 0 or 1");\n        let uploads: Vec<_> = encoders.drain(..batch.upload_encoder_count).collect();\n        let (upload_back, upload_encoded) = channel();\n        let (render_back, render_encoded) = channel();\n        if uploads.is_empty() {\n            let _ = upload_back.send(Vec::new());\n        } else {\n            self.encoding.fetch_add(1, Ordering::Release);\n            let _ = self.upload_jobs.send((uploads, upload_back));\n        }\n        if encoders.is_empty() {\n            let _ = render_back.send(Vec::new());\n        } else {\n            self.encoding.fetch_add(1, Ordering::Release);\n            let _ = self.jobs.send((encoders, render_back));\n        }\n        // Both receivers are consumed in send order on the original submit thread.\n        let _ = self.batches.send((batch, (upload_encoded, render_encoded)));\n    }'''
          exact(submit,old_send,new_send,'dispatch upload and render to separate finish workers')
          exact(submit,
              '        let Ok(mut buffers) = encoded.recv() else { return };',
              '        let (upload_encoded, render_encoded) = encoded;\n        let Ok(mut buffers) = upload_encoded.recv() else { return };\n        let Ok(render_buffers) = render_encoded.recv() else { return };\n        buffers.extend(render_buffers);',
              'join upload-before-render buffers before same queue.submit')
          final=submit.read_text()
          assert final.count('const ENCODE_THREADS: usize = 1;')==1
          assert 'const FRAMES_IN_FLIGHT: usize = 1;' in final
          assert 'const PENDING: usize = 4;' in final
          assert 'SN512A V8.5 GPU lifetimes:' in final
          assert final.count('queue.submit(buffers)')>=1
          assert final.count('upload_encoding.fetch_sub(1')==1
          assert 'let Ok(mut buffers) = upload_encoded.recv()' in final
          assert 'let Ok(render_buffers) = render_encoded.recv()' in final
          assert final.count('let (upload_jobs, upload_rx) = channel::<Job>();')==1
          assert exec_rs.read_text().count('upload_encoder_count')==2
          report=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'v85-audit'
          report.mkdir(parents=True,exist_ok=True)
          (report/'v93-upload-worker.json').write_text(json.dumps({
              'version':'V9.3','render_workers':1,'dedicated_upload_finish_workers':1,
              'gpu_queue_count':1,'upload_before_draw_order':True,
              'batch_encoder_finish_parallel':True,
              'engine_data_copy_moved_off_command_thread':False,
              'textures_and_buffers_share_upload_encoder':True,
              'shader_matching':'V9.2 experimental 45 aliases unchanged',
              'strict_resource_epoch_completion':'unchanged',
              'submission_fences':'unchanged',
              'notes':'The split is CommandEncoder::finish() only; not additional GPU hardware and not proven FPS improvement.',
              'submit_sha256':hashlib.sha256(submit.read_bytes()).hexdigest(),
              'exec_sha256':hashlib.sha256(exec_rs.read_bytes()).hexdigest()},indent=2)+'\n')
          print('V9.3: dedicated upload finish worker + single render finish worker, unchanged one GPU queue and strict epoch lifetimes.')
          PY_SN512A_V93
          python3 -m py_compile /tmp/sn512a_v93_upload_encoder.py
          python3 /tmp/sn512a_v93_upload_encoder.py
          git diff --check
          grep -Fq 'SN512A V9.3 DEDICATED_UPLOAD_FINISH:' crates/glue5-gpu/src/submit.rs
          grep -Fq 'buffers.extend(render_buffers);' crates/glue5-gpu/src/submit.rs
          grep -Fq 'const FRAMES_IN_FLIGHT: usize = 1;' crates/glue5-gpu/src/submit.rs
          echo 'V9.3: 1 worker finishes upload encoders and 1 worker finishes render encoders. Upload buffers submitted before render buffers on the same GPU queue; no new GPU queue, texture CPU staging changes, or lifetime/present changes.' >> "$GITHUB_STEP_SUMMARY"
      - name: V9.5 R2 - Two-way per-stage CPU bind-group hot cache (preserve V9.3 GPU stability)
        run: |
          set -euo pipefail
          cat > /tmp/mali_g57_mc2_v95_bind_cache.py <<'PY_G57_V95'
          from pathlib import Path
          import hashlib, json, os
          draw=Path('crates/glue5-gpu/src/draw.rs')
          ex=Path('crates/glue5-gpu/src/exec.rs')
          submit=Path('crates/glue5-gpu/src/submit.rs')
          src=draw.read_text()
          def replace_one(old, new, label):
              global src
              count=src.count(old)
              if count!=1:
                  raise SystemExit(f'V9.5 ABORT: {label}: expected 1 patch anchor, found {count}')
              src=src.replace(old,new,1)
          # Cache two recent bind groups per shader stage (VS/PS/CS) instead of one.
          # Each entry retains the V8.7 exact key and serial; on hit it returns the
          # exact previously generated wgpu::BindGroup. No new GPU resource or pipeline.
          # Aging, budget trimming, and eviction still invalidate the entire hot cache.
          replace_one(
              'hot: [Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 3],',
              'hot: [[Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 2]; 3],',
              'stage-by-stage 1-way -> 2-way hot cache capacity')
          replace_one(
              '    pub sn512a_hot_hits: u64,\n    pub sn512a_hot_lookups: u64,',
              '    pub sn512a_hot_hits: u64,\n    pub sn512a_hot_lookups: u64,\n    pub sn512a_v95_secondary_hot_hits: u64,',
              'secondary-slot hit counter')
          replace_one(
              '''        if let Some(Some((hot_key, bg, serial))) = self.hot.get(stage) {
                      if hot_key.as_ref() == key {
                          self.sn512a_hot_hits += 1;
                          return Some((bg.clone(), *serial));
                      }
                  }''',
              '''        if let Some(stage_hot) = self.hot.get_mut(stage) {
                      // Most-recently-used entry first: an exact-key match is safe.
                      if let Some((hot_key, bg, serial)) = &stage_hot[0] {
                          if hot_key.as_ref() == key {
                              self.sn512a_hot_hits += 1;
                              return Some((bg.clone(), *serial));
                          }
                      }
                      // Keep the second recent group live when a stage alternates
                      // between two keys. Promote an exact hit to MRU slot.
                      if stage_hot[1].as_ref().is_some_and(|(hot_key, _, _)| hot_key.as_ref() == key) {
                          stage_hot.swap(0, 1);
                          let (_, bg, serial) = stage_hot[0].as_ref().expect("promoted hot bind entry");
                          self.sn512a_hot_hits += 1;
                          self.sn512a_v95_secondary_hot_hits += 1;
                          return Some((bg.clone(), *serial));
                      }
                  }''',
              'two-way key comparison and MRU promotion')
          replace_one(
              '''        if let Some((bg, serial)) = &found {
                      if let Some(slot) = self.hot.get_mut(stage) {
                          *slot = Some((key.into(), bg.clone(), *serial));
                      }
                  }''',
              '''        if let Some((bg, serial)) = &found {
                      if let Some(stage_hot) = self.hot.get_mut(stage) {
                          stage_hot[1] = stage_hot[0].take();
                          stage_hot[0] = Some((key.into(), bg.clone(), *serial));
                      }
                  }''',
              'promote map hits to MRU slot')
          replace_one(
              '''        if let Some(slot) = self.hot.get_mut(key.get(1).copied().unwrap_or(3) as usize) {
                      *slot = Some((key.into(), bg.clone(), self.serial));
                  }''',
              '''        if let Some(stage_hot) = self.hot.get_mut(key.get(1).copied().unwrap_or(3) as usize) {
                      stage_hot[1] = stage_hot[0].take();
                      stage_hot[0] = Some((key.into(), bg.clone(), self.serial));
                  }''',
              'new bind-group insert to MRU slot')
          for safe_marker in ['self.hot = Default::default();',
                              'if dropped.is_some() { self.hot = Default::default(); }',
                              'self.current.insert(key.into(), (bg, self.serial));',
                              'let (k, v) = self.old.remove_entry(key)?;',
                              'hot: [[Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 2]; 3]']:
              if safe_marker not in src:
                  raise SystemExit('V9.5 ABORT: cache generation/eviction invariant missing: ' + safe_marker)
          if src.count('self.hot = Default::default();') < 3:
              raise SystemExit('V9.5 ABORT: insufficient age/pressure/eviction cache invalidations')
          sub=submit.read_text()
          required={
              'const ENCODE_THREADS: usize = 1;':1,
              'const FRAMES_IN_FLIGHT: usize = 1;':1,
              'const PENDING: usize = 4;':1,
              'SN512A V9.3 DEDICATED_UPLOAD_FINISH:':1,
              'queue.submit(buffers)':2, # V9.3 has two existing call sites; same single GPU queue.
              'let Ok(mut buffers) = upload_encoded.recv()':1,
              'let Ok(render_buffers) = render_encoded.recv()':1,
          }
          for needle, count in required.items():
              if sub.count(needle)!=count:
                  raise SystemExit(f'V9.5 ABORT: stable V9.3 GPU invariant {needle!r} expected {count}, found {sub.count(needle)}')
          if 'const ENCODE_THREADS: usize = 2;' in sub or 'SN512A V9.4 THREE_ENCODING_LANES' in sub:
              raise SystemExit('V9.5 ABORT: V9.4 regression present: 2 render workers')
          if ex.read_text().count('upload_encoder_count') != 2:
              raise SystemExit('V9.5 ABORT: V9.3 dedicated upload ordering is missing')
          if 'SN512A V9.2 SHADER_ALIAS:' not in Path('crates/glue5-gpu/src/shader.rs').read_text():
              raise SystemExit('V9.5 ABORT: V9.2 shader alias stage missing')
          draw.write_text(src)
          # Log cumulative hit ratio and secondary slot usage without touching
          # actual GPU workload, resource budget, or submission logic.
          exe=ex.read_text()
          import re
          # V8.7's generated telemetry uses different indentation from the
          # nested patch literal. Match the complete log argument/closing line,
          # not a hard-coded number of leading spaces (R1 false failure).
          old_pattern = re.compile(
              r'^(?P<arg_indent>[ \t]+)self\.binds\.sn512a_hot_hits, self\.binds\.sn512a_hot_lookups\);(?=\r?$)',
              re.MULTILINE)
          matches = list(old_pattern.finditer(exe))
          if len(matches) != 1 or 'SN512A V8.7 CPU fastpaths: redundant_rt={} hot_groups={}/{}' not in exe:
              raise SystemExit(f'V9.5 ABORT: V8.7 CPU telemetry source signature mismatch: found {len(matches)} closing lines')
          closing = matches[0]
          indent = closing.group('arg_indent')
          # Log the additional counter within the original periodic telemetry
          # block. Do not alter the existing log or GPU execution path.
          log_indent = indent[:-4] if indent.endswith('    ') else indent
          new_code = (
              '\n' + log_indent + 'log::info!("MALI-G57-MC2 V9.5 BIND_HOT_2WAY: total_hits={} secondary_hits={} lookups={}",'
              + '\n' + indent + 'self.binds.sn512a_hot_hits,'
              + '\n' + indent + 'self.binds.sn512a_v95_secondary_hot_hits,'
              + '\n' + indent + 'self.binds.sn512a_hot_lookups);')
          exe=exe[:closing.end()] + new_code + exe[closing.end():]
          ex.write_text(exe)
          report=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'v85-audit'
          report.mkdir(parents=True,exist_ok=True)
          (report/'v95-two-way-hot-bind-cache.json').write_text(json.dumps({
              'version':'V9.5 R2','target_gpu':'Mali-G57 MC2',
              'change':'2-entry MRU cache for each VS/PS/CS bind group, six entries total',
              'no_extra_gpu_bindings':True,'serial_checked_on_existing_group':True,
              'age_and_memory_pressure_invalidation_preserved':True,
              'render_finish_workers':1,'upload_finish_workers':1,'gpu_queue':1,
              'strict_fences':True,'V9.4_two_render_regression_excluded':True,
              'v92_45_experimental_shader_aliases':'unchanged',
              'game_wasm':'unaltered',
              'expected_gain':'unknown until on-device frame-time and hit-ratio comparison',
              'draw_sha256':hashlib.sha256(draw.read_bytes()).hexdigest(),
              'exec_sha256':hashlib.sha256(ex.read_bytes()).hexdigest(),
          },indent=2)+'\n')
          print('V9.5 patched 2-way MRU CPU bind lookup; V9.3 GPU threading+resource fences PRESERVED.')
          PY_G57_V95
          python3 -m py_compile /tmp/mali_g57_mc2_v95_bind_cache.py
          python3 /tmp/mali_g57_mc2_v95_bind_cache.py
          git diff --check
          grep -Fq 'hot: [[Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 2]; 3]' crates/glue5-gpu/src/draw.rs
          grep -Fq 'MALI-G57-MC2 V9.5 BIND_HOT_2WAY' crates/glue5-gpu/src/exec.rs
          grep -Fq 'const ENCODE_THREADS: usize = 1;' crates/glue5-gpu/src/submit.rs
          echo 'V9.5 R2: Two-way per-stage MRU CPU bind-group hot cache (VS/PS/CS) replaces one-way cache, with cache-generation invalidation maintained. All GPU synchronization, resource lifetime, GPU memory and worker configuration remain V9.3. Logs count secondary hits. 45 experimental VS aliases unchanged. On-device validation pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: V9.6 - Correct pause-map MIN alpha blend routing (preserve V9.5 R2)
        run: |
          set -euo pipefail
          cat > /tmp/mali_g57_mc2_v96_pause_map.py <<'PY_G57_V96'
          from pathlib import Path
          import json, hashlib, os
          shader = Path('crates/glue5-gpu/src/shader.rs')
          draw = Path('crates/glue5-gpu/src/draw.rs')
          sub = Path('crates/glue5-gpu/src/submit.rs')
          old = '''pub fn pause_map_blend(words: &[u32]) -> bool {
              words.get(2) == Some(&1) && words.get(5) == Some(&4) && words.get(8) == Some(&4) && words.get(9) == Some(&8)
          }'''
          new = '''/// Map tiles may enable MIN blend operations on the active render
          /// target while retaining additional color writes (e.g. RGBA instead
          /// of only alpha). On independently blended render targets the relevant
          /// state can also be stored in the corresponding 8-word block.
          /// This accepts only enabled MIN color+alpha operations with an alpha
          /// write bit, not arbitrary UI blends. HUD masks keep their normal path.
          pub fn pause_map_blend(words: &[u32]) -> bool {
              let min_alpha = |base: usize| {
                  words.get(base) == Some(&1)
            && words.get(base + 3) == Some(&4)
            && words.get(base + 6) == Some(&4)
            && words.get(base + 7).is_some_and(|mask| mask & 8 != 0)
              };
              min_alpha(2)
                  || (words.get(1) == Some(&1)
            && (1..8).any(|rt| min_alpha(2 + rt * 8)))
          }'''
          src = shader.read_text()
          if src.count(old) != 1:
              raise SystemExit(f'V9.6 ABORT: upstream pause map blend classifier anchor found {src.count(old)} times')
          shader.write_text(src.replace(old,new,1))
          old_draw = '            let pause = self.objs.state(self.s.blend).is_some_and(|s| shader::pause_map_blend(&s.words));'
          new_draw = '''            // V9.6 uses the shared, conservative MIN-alpha classifier to
            // distinguish the pause-map world-space program from HUD masks.
            let blend_words: &[u32] = self.objs.state(self.s.blend)
                .map_or(&[], |s| s.words.as_ref());
            let was_strict = blend_words.get(2) == Some(&1)
                && blend_words.get(5) == Some(&4)
                && blend_words.get(8) == Some(&4)
                && blend_words.get(9) == Some(&8);
            let pause = shader::pause_map_blend(blend_words);
            // One-time bounded diagnostics: no locks and no per-frame spam.
            // Different counters allow the map to be opened after the HUD.
            static MALI_V96_MAP_TAKEN: std::sync::atomic::AtomicUsize =
                std::sync::atomic::AtomicUsize::new(0);
            static MALI_V96_HUD_TAKEN: std::sync::atomic::AtomicUsize =
                std::sync::atomic::AtomicUsize::new(0);
            let counter = if pause { &MALI_V96_MAP_TAKEN } else { &MALI_V96_HUD_TAKEN };
            if counter.fetch_add(1, std::sync::atomic::Ordering::Relaxed) < 6 {
                log::info!("MALI-G57-MC2 V9.6 MAP_ROUTE: selected_pause_map={} old_strict={} blend_id={} blend_words={:?} rt0={} depth={} NO_EXTRA_GPU_WORK",
                    pause, was_strict, self.s.blend, blend_words, self.s.rt[0].tex, self.s.ds.tex);
            }'''
          dsrc = draw.read_text()
          if dsrc.count(old_draw) != 1:
              raise SystemExit(f'V9.6 ABORT: upstream map draw classifier anchor found {dsrc.count(old_draw)} times')
          # No other draw branch, shader routing, pipeline cache, or GPU queue changes.
          draw.write_text(dsrc.replace(old_draw,new_draw,1))
          rendered = draw.read_text()
          ss = sub.read_text()
          checks = {
              'V9.5 two-way bind cache': 'hot: [[Option<(Box<[u32]>, wgpu::BindGroup, u64)>; 2]; 3]' in rendered,
              'V9.3 single render worker': 'const ENCODE_THREADS: usize = 1;' in ss,
              'V9.3 dedicated upload worker': 'SN512A V9.3 DEDICATED_UPLOAD_FINISH:' in ss,
              'strict single in-flight buffer': 'const FRAMES_IN_FLIGHT: usize = 1;' in ss,
              'correct shader branch': '"im::VS_TransformUnlit_IM", Stage::Vertex' in rendered,
              'V9.2 aliases preserved': 'SN512A V9.2 SHADER_ALIAS:' in shader.read_text(),
          }
          for title, ok in checks.items():
              if not ok: raise SystemExit('V9.6 ABORT: invariant missing: '+title)
          report = Path(os.environ.get('RUNNER_TEMP','/tmp'))/'v85-audit'
          report.mkdir(parents=True,exist_ok=True)
          (report/'v96-pause-map-route-repair.json').write_text(json.dumps({
              'version':'V9.6','base':'V9.5 R2',
              'patch':'treat MIN-color+MIN-alpha blends with alpha write bit on shared/independent RT blocks as pause map',
              'scope':'existing im::VS_Blit + im::PS_BlitDepthToAlpha branch only',
              'old_exact_alpha_only_mask_still_supported':True,
              'other_draws_untouched':True,
              'game_data_and_wasm_untouched':True,
              'gpu_workers':'1 render + 1 dedicated upload + 1 ordered GPU queue',
              'strict_resource_fences':'unchanged',
              'new_logs':'MALI-G57-MC2 V9.6 MAP_ROUTE',
              'confidence':'targeted renderer correction; physical map display not yet validated',
              'shader_sha256':hashlib.sha256(shader.read_bytes()).hexdigest(),
              'draw_sha256':hashlib.sha256(draw.read_bytes()).hexdigest(),
          },indent=2)+'\n')
          print('V9.6: pause-map MIN alpha blend classifier extended; V9.5 R2 cache+GPU threading untouched.')
          PY_G57_V96
          python3 -m py_compile /tmp/mali_g57_mc2_v96_pause_map.py
          python3 /tmp/mali_g57_mc2_v96_pause_map.py
          git diff --check
          grep -Fq 'MALI-G57-MC2 V9.6 MAP_ROUTE:' crates/glue5-gpu/src/draw.rs
          grep -Fq 'const ENCODE_THREADS: usize = 1;' crates/glue5-gpu/src/submit.rs
          echo 'V9.6: Targeted pause-map renderer routing correction: MIN alpha blends with RGBA or independent render-target mask are classified as pause-map, rather than HUD. Keeps V9.5 R2 hot-bind cache, 1 render + 1 upload worker, one ordered GPU queue, strict lifetime fences and existing shader alias set. Map appearance still requires device verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save V8.7 CPU patches and source provenance (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: MALI-G57-MC2-V9.6-PAUSE-MAP-REPAIR-${{ inputs.cpu_fastpaths }}-${{ inputs.encoder_workers }}
          path: ${{ runner.temp }}/v85-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Set up release signing key (preserve it for future updates)
        run: |
          set -euo pipefail
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          cd ~/.android
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" get '${{ steps.game.outputs.release }}' Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE/glue5" exec -- keytool -genkeypair -noprompt \
              -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=SN512A V8 Debug,O=Android,C=US'
          fi
      - name: Compile GLUE 5 Android AOT game and app
        env:
          # Official GLUE 5 build script explicitly permits an unknown build in
          # experimental mode. Hook resolution can fail if code differs.
          GLUE5_ALLOW_UNKNOWN_BUILD: '1'
        run: |
          set -euo pipefail
          mise run android:build
          test -s target/android/gradle/outputs/apk/release/Glue5-release.apk
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk "$RUNNER_TEMP/Glue5-android.apk"
          cp ~/.android/debug.keystore "$RUNNER_TEMP/Glue5-android.keystore"
          # Confirm that the three mandatory JNI libraries are actually in
          # the signed APK. Missing optional AdrenoTools are acceptable on Mali.
          python3 - "$RUNNER_TEMP/Glue5-android.apk" <<'PY_APK_CHECK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              required = {f'lib/arm64-v8a/{name}' for name in
                          ('libglue5.so', 'libSDL3.so', 'libc++_shared.so')}
              absent = sorted(required - names)
              if absent:
                  raise SystemExit('Signed APK missing mandatory JNI libraries: ' + ', '.join(absent))
              print('Verified: GLUE 5, SDL3 and libc++ JNI libraries are in signed APK')
          PY_APK_CHECK
          sha256sum "$RUNNER_TEMP/Glue5-android.apk"
      - name: Keep an additional downloadable signed APK in this Actions run (private)
        uses: actions/upload-artifact@v4
        with:
          name: MALI-G57-MC2-GLUE5-V9.6-PAUSE-MAP-REPAIR-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}-signed-APK
          path: ${{ runner.temp }}/Glue5-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Keep signed test APK private in the SAME DRAFT release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cp Glue5-android.apk Glue5-android-MALI-G57-MC2-V9.6-PAUSE-MAP-REPAIR-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" upload '${{ steps.game.outputs.release }}' Glue5-android-MALI-G57-MC2-V9.6-PAUSE-MAP-REPAIR-${{ inputs.cpu_fastpaths }}-ENC-${{ inputs.encoder_workers }}.apk
          echo 'V9.5: Stable V9.3 GPU threading (1 render, 1 upload) with TWO-WAY stage-local CPU bind-group hot cache. Exactly one ordered GPU queue, strict GPU fences and same 704 MiB default cache-trim trigger. No game.wasm or asset modification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'V9.5 experimental CPU optimization (not yet device-validated): 2-way LRU hot bind cache per stage (6 entries total) with correct eviction invalidation. 45 unverified vertex-shader donor aliases preserved, GLUE5 consts:false fix and Documents logs retained. V9.4 three-worker device-loss regression NOT carried forward.' >> "$GITHUB_STEP_SUMMARY"
