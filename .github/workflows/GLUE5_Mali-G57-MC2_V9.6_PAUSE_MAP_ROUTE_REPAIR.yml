          helper=r'''
          // SN512A V8.8: a shader translated for the same *bytecode hash* can be
          // shared between the user's OWN copies of build-specific translated packs.
          // Index labels must match if both packs have an entry. No shader substitutions
          // by just an effect name (bindings may be incompatible), no modifications to
          // game data, and no directory traversal outside the sibling `game/b/*` packs.
          #[cfg(target_os = "android")]
          fn sn512a_recover_exact_shaders(dir: &Path, index: &mut HashMap<u64, Entry>) {
