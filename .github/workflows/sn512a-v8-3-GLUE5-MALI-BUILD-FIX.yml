# Experimental SN512A 768 MiB STREAMING resource-heap test, using GLUE 5.
# Important: GLUE 5 is a different runtime from the existing BytArch/V5b/V7 APK.
# The special behavior works because GLUE 5 ALREADY hooks the RAGE buddy allocator.
# It is NOT safe to simulate this by capping WebAssembly memory to 768 MiB.
#
# Private game data: attach your own matching game.wasm to a DRAFT RELEASE in
# this repository, NEVER commit it or publish it. The APK goes back into that draft.
name: SN512A GTA V V8.3 FIX - Graphics Menu, Mali packaging fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sn512a-v83-fix-glue5-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: glue5
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/glue5
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out our workflow repository (never includes game.wasm)
        uses: actions/checkout@v4
        with:
          path: user-repo
          persist-credentials: false
      - name: Check out GLUE 5 source for its actual memory-budget hooks
        uses: actions/checkout@v4
        with:
          repository: mempage4k/glue5
          ref: main
          path: glue5
          fetch-depth: 1
          persist-credentials: false
      - name: Verify low-memory streaming budget and force 768 MiB for this SN512A test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          imports = Path('crates/glue5-runtime/src/imports.rs')
          mem = Path('crates/glue5-runtime/src/memory.rs')
          old = imports.read_text()
          hook = mem.read_text()
          expected = 'None if name == "gameResourceMB" && low => default.min(768),'
          replacement = 'None if name == "gameResourceMB" => 768,'
          if old.count(expected) != 1:
              raise SystemExit('GLUE5 upstream changed gameResourceMB handling; refusing unverified build.')
          required = (
              'pub(crate) fn budget_resource_heap(mb: u32)',
              'pub(crate) unsafe extern "C" fn grow_heap(',
              'pub(crate) unsafe extern "C" fn memory_available(',
              'pub(crate) unsafe extern "C" fn largest_block(',
              'hooks.grow_heap = Some(grow_heap);',
              'hooks.memory_available = Some(memory_available);',
              'hooks.largest_block = Some(largest_block);',
          )
          missing = [s for s in required if s not in hook]
          if missing:
              raise SystemExit('GLUE5 streaming-memory enforcement hooks missing: ' + repr(missing))
          if 'crate::memory::budget_resource_heap(value)' not in old:
              raise SystemExit('GLUE5 no longer connects the gameResourceMB value to heap budget.')
          imports.write_text(old.replace(expected, replacement, 1))
          assert imports.read_text().count(replacement) == 1
          print('V8/source verified: Android gameResourceMB=768 MiB; RAGE streaming budget hooks available.')
          print('The hooks intercept availability checks and allow necessary allocation growth.')
          PY
          git diff --check
          git diff -- crates/glue5-runtime/src/imports.rs
          sha256sum crates/glue5-runtime/src/imports.rs | tee "$RUNNER_TEMP/glue5_v8_memory_patch_sha256.txt"
      - name: Install SN512A V8.2 on-device GPU diagnostics (no root or ADB)
        run: |
          set -euo pipefail
          python3 - <<'PY_V82'
          from pathlib import Path
          path = Path('crates/glue5/src/lib.rs')
          src = path.read_text()
          target = 'mod paths;\n'
          assert src.count(target) == 1, 'GLUE5 path modules changed'
          src = src.replace(target, target + '#[cfg(target_os = "android")]\nmod sn512a_diag;\n', 1)
          old = '''        // RUST_LOG as on desktop (the launch intent's extras, see Glue5Activity).
                  let spec = std::env::var("RUST_LOG").unwrap_or_else(|_| "info".into());
                  let filter = android_logger::FilterBuilder::new().parse(&spec).build();
                  let level = filter.filter();
                  android_logger::init_once(android_logger::Config::default().with_tag("glue5").with_max_level(level).with_filter(filter));'''
          # The Android native application uses only one process-wide log logger.
          # Replace its logcat-only logger with a logcat + accessible-file logger.
          assert src.count(old)==1, 'GLUE5 Android logger source changed'
          src=src.replace(old, '''        // SN512A V8.2: initialize file logging in app::run
                  // after SDL is ready to provide the app-owned external path.''', 1)
          path.write_text(src)
          path=Path('crates/glue5/src/paths.rs')
          src=path.read_text()
          old='#[cfg(target_os = "android")]\nfn android_external_dir() -> Option<PathBuf> {'
          assert src.count(old)==1, 'GLUE5 Android external folder helper changed'
          path.write_text(src.replace(old, '#[cfg(target_os = "android")]\npub(crate) fn android_external_dir() -> Option<PathBuf> {',1))
          path=Path('crates/glue5/src/app.rs')
          src=path.read_text()
          # Match the SDL initialization statement by its content, rather than
          # assuming eight leading spaces. Current GLUE 5 uses four.
          startup='let sdl = sdl3::init().map_err(|e| anyhow!("SDL: {e}"))?;'
          assert src.count(startup)==1, 'GLUE5 SDL initialization statement missing or ambiguous'
          src=src.replace(startup, startup + '\n    #[cfg(target_os = "android")]\n    crate::sn512a_diag::init();', 1)
          anchor='''        let why = why.as_str();
                  if let Err(e) = std::fs::write(self.user_dir.join(FAILURE_FILE), why) {'''
          assert src.count(anchor)==1, 'GLUE5 game-stopped handler changed'
          src=src.replace(anchor, '''        let why = why.as_str();
                  #[cfg(target_os = "android")]
                  crate::sn512a_diag::save_failure(&self.user_dir, why);
                  if let Err(e) = std::fs::write(self.user_dir.join(FAILURE_FILE), why) {''',1)
          path.write_text(src)
          PY_V82
          cat > crates/glue5/src/sn512a_diag.rs <<'RUST_V82'
          //! SN512A diagnostics: preserves GLUE 5's GPU and runtime log:: events
          //! in Android/data/local.glue5/files/logs/ without READ_LOGS, ADB or root.
          //! Uses only app-owned external storage; does not modify game files.
          use std::fs::{self, File};
          use std::io::{self, Read, Seek, SeekFrom, Write};
          use std::path::{Path, PathBuf};
          use std::sync::{Mutex, OnceLock};
          use std::time::{SystemTime, UNIX_EPOCH};
          use log::{Level, LevelFilter, Log, Metadata, Record};
          
          #[link(name = "log")]
          unsafe extern "C" {
              fn __android_log_write(priority: std::os::raw::c_int,
                                     tag: *const std::os::raw::c_char,
                                     text: *const std::os::raw::c_char) -> std::os::raw::c_int;
          }
          
          const MAX_FILE_BYTES: u64 = 4 * 1024 * 1024;
          struct DualLogger {
              path: Option<PathBuf>,
              output: Mutex<Option<File>>,
          }
          static LOGGER: OnceLock<DualLogger> = OnceLock::new();
          
          fn log_dir() -> Option<PathBuf> {
              let root = crate::paths::android_external_dir()?;
              let dir = root.join("logs");
              fs::create_dir_all(&dir).ok()?;
              Some(dir)
          }
          
          impl Log for DualLogger {
              fn enabled(&self, m: &Metadata<'_>) -> bool { m.level() <= Level::Info }
              fn log(&self, record: &Record<'_>) {
                  if !self.enabled(record.metadata()) { return; }
                  let now = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default();
                  let line = format!("{}.{:03} [{}] {}: {}\n",
                      now.as_secs(), now.subsec_millis(), record.level(), record.target(), record.args());
                  // Keep Android logcat output, for standard troubleshooting too.
                  let prio = match record.level() {
                      Level::Error => 6, Level::Warn => 5, Level::Info => 4,
                      Level::Debug => 3, Level::Trace => 2,
                  };
                  if let Ok(c) = std::ffi::CString::new(line.trim_end().replace('\0', " ")) {
                      unsafe { __android_log_write(prio, c"glue5".as_ptr(), c.as_ptr()); }
                  }
                  if let Ok(mut out) = self.output.lock() {
                      if let Some(path) = &self.path {
                          if out.as_ref().is_some_and(|f| f.metadata().is_ok_and(|m| m.len() >= MAX_FILE_BYTES)) {
                              // Retain the most recent 4 MiB, bounded to 8 MiB total.
                              *out = None;
                              let _ = fs::rename(path, path.with_file_name("host-previous.log"));
                              *out = File::create(path).ok();
                          }
                      }
                      if let Some(f) = out.as_mut() {
                          let _ = f.write_all(line.as_bytes());
                          // Device-lost errors must survive an immediate process exit.
                          let _ = f.flush();
                      }
                  }
              }
              fn flush(&self) {
                  if let Ok(mut out) = self.output.lock() {
                      if let Some(f) = out.as_mut() { let _ = f.flush(); }
                  }
              }
          }
          
          pub(crate) fn init() {
              let path = log_dir().map(|dir| dir.join("host.log"));
              if let Some(p) = &path {
                  let _ = fs::rename(p, p.with_file_name("host-previous.log"));
              }
              let output = path.as_ref().and_then(|p| File::create(p).ok());
              let _ = LOGGER.set(DualLogger { path, output: Mutex::new(output) });
              if let Some(logger) = LOGGER.get() {
                  if log::set_logger(logger).is_ok() {
                      log::set_max_level(LevelFilter::Info);
                      log::info!("SN512A V8.2 diagnostics active; GPU errors mirrored to Android/data/local.glue5/files/logs/host.log");
                  }
              }
          }
          
          /// Copy only the last 1 MiB of the private game.log after a failure.
          /// The full 20 GiB game folder is never touched or moved.
          pub(crate) fn save_failure(user_dir: &Path, reason: &str) {
              log::error!("SN512A V8.2 game stopped: {reason}");
              let Some(dir) = log_dir() else { return; };
              let _ = fs::write(dir.join("last-failure.txt"), format!("{reason}\n"));
              let Ok(mut src) = File::open(user_dir.join("game.log")) else { return; };
              let Ok(len) = src.metadata().map(|m| m.len()) else { return; };
              if src.seek(SeekFrom::Start(len.saturating_sub(1 << 20))).is_err() { return; }
              if let Ok(mut dst) = File::create(dir.join("game-tail.log")) {
                  let _ = io::copy(&mut src.take(1 << 20), &mut dst);
                  let _ = dst.flush();
              }
          }
          RUST_V82
          # All device lost, heartbeat and wgpu device error messages flow
          # through log::error!, so the new logger records them without
          # changing GPU synchronization or resource ownership.
          grep -Fq 'sn512a_diag::init();' crates/glue5/src/app.rs
          grep -Fq 'SN512A V8.2' crates/glue5/src/sn512a_diag.rs
          grep -Fq 'save_failure(&self.user_dir, why);' crates/glue5/src/app.rs
          grep -Fq 'host.log' crates/glue5/src/sn512a_diag.rs
          git diff --check
          git diff --stat
          echo 'SN512A V8.2: diagnostic logger installed, 768MiB stream budget remains unchanged.'
      - name: Install SN512A V8.3 graphics controls in the native Settings menu
        run: |
          set -euo pipefail
          cat > /tmp/sn512a_v83_patch.py <<'PY_SN512A_GRAPHICS'
          #!/usr/bin/env python3
          """Add an SN512A graphics settings tab to GLUE5's native pre-launch UI.
          
          Uses upstream GTA V settings.xml to alter actual game graphics settings. Only
          edits while game is stopped. Existing engine pause-menu controls still work.
          """
          from pathlib import Path
          import sys
          
          root = Path(sys.argv[1])
          
          
          def transform(rel, ops):
              f = root / rel
              src = f.read_text()
              for old, new, label in ops:
                  n = src.count(old)
                  if n != 1:
                      raise RuntimeError(f'{rel}: {label}: expected 1 match, found {n}. Refusing to patch unknown upstream source')
                  src = src.replace(old, new, 1)
              f.write_text(src)
              print('patched', f)
          
          
          transform('crates/glue5/src/ui.rs', [(
              '    Video,\n    Controls,\n    Game,\n}\npub struct Ui {',
              '    Video,\n    Graphics,\n    Controls,\n    Game,\n}\npub struct Ui {', 'tab enum',
          )])
          
          transform('crates/glue5-runtime/src/game_settings.rs', [(
              '#[cfg(test)]\nmod tests {',
              '''/// Read a graphic setting from settings.xml (or the engine's defaults).
          /// Exposed to the SN512A pre-launch UI; no live game-memory manipulation.
          pub fn read_setting(user_dir: &Path, name: &str) -> Option<String> {
              let xml = std::fs::read_to_string(path(user_dir)).unwrap_or_else(|_| DEFAULTS.to_string());
              let tag = format!("<{name} value=\\\"");
              let start = xml.find(&tag)? + tag.len();
              let end = xml[start..].find('"')?;
              Some(xml[start..start + end].to_owned())
          }
          #[cfg(test)]
          mod tests {''',
              'read_setting helper',
          )])
          
          transform('crates/glue5/src/ui/pages.rs', [
              (
                  'let tabs = [(SettingsTab::Video, "VIDEO"), (SettingsTab::Controls, "CONTROLS"), (SettingsTab::Game, "GAME")];',
                  'let tabs = [(SettingsTab::Video, "VIDEO"), (SettingsTab::Graphics, "GRAPHICS"), (SettingsTab::Controls, "CONTROLS"), (SettingsTab::Game, "GAME")];',
                  'settings tabs',
              ),
              (
                  'fn settings_items(\n    ui: &mut egui::Ui,',
                  '''// SN512A V8.3: graphics settings are the ENGINE's own values, not
          // emulator-only switches. Use the normal in-game Graphics menu while playing.
          // Changing graphics from this page is allowed before game launch only.
          fn sn512a_graphics_choice(
              ui: &mut egui::Ui,
              dir: &std::path::Path,
              title: &str,
              key: &str,
              options: &[(&str, &str)],
          ) {
              let current = glue5_runtime::game_settings::read_setting(dir, key).unwrap_or_default();
              let mut selected = options.iter().position(|(v, _)| *v == current).unwrap_or(0);
              let choices: Vec<(usize, &str)> = options.iter().enumerate().map(|(i, (_, label))| (i, *label)).collect();
              let resp = setting(ui, title, Control::Choice, None, |ui| choice(ui, &mut selected, &choices));
              if resp.changed() {
                  if let Err(e) = glue5_runtime::game_settings::apply(dir, &[(key, options[selected].0)]) {
                      ui.colored_label(WARN, format!("Could not save {title}: {e}"));
                  }
              }
          }
          
          fn sn512a_graphics_menu(ui: &mut egui::Ui, settings: &mut Settings, status: &Status) {
              if status.started.is_some() {
                  ui.label("Graphics changes while playing: open the game's menu (☰ / Start), then Settings > Graphics or Advanced Graphics.");
                  ui.label("Some changes require restarting the game.");
                  return;
              }
              let Ok(dir) = paths::user_dir() else {
                  ui.colored_label(WARN, "Cannot locate game settings directory");
                  return;
              };
              // Preserve GLUE 5's normal initial low-memory baseline, then let the
              // player override individual quality options. Do not change 768 MiB pool.
              if settings.low_memory && !settings.low_preset_written {
                  if glue5_runtime::game_settings::apply_low_preset(&dir).is_ok() {
                      settings.low_preset_written = true;
                  } else {
                      ui.colored_label(WARN, "Could not write initial low-memory graphics preset");
                      return;
                  }
              }
              ui.label("SN512A graphics quality - applies at the next launch. Keep Low memory ON for 6 GB RAM.");
              ui.label("Higher texture, grass and distance settings can cause GPU loss or memory pressure.");
              sn512a_graphics_choice(ui, &dir, "View distance", "LodScale", &[
                  ("0.000000", "Minimum"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("0.750000", "75%"), ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Texture quality", "TextureQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Water quality", "WaterQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Grass quality", "GrassQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"), ("3", "Ultra"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Shadow quality", "ShadowQuality", &[
                  ("1", "Normal"), ("2", "High"), ("3", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Shadow edges", "Shadow_SoftShadows", &[
                  ("0", "Sharp"), ("1", "Soft"), ("2", "Softer"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Reflections", "ReflectionQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"), ("3", "Ultra"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Reflection AA", "ReflectionMSAA", &[
                  ("0", "Off"), ("2", "2x"), ("4", "4x"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Particle quality", "ParticleQuality", &[
                  ("0", "Normal"), ("1", "High"), ("2", "Very high"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Population density", "CityDensity", &[
                  ("0.000000", "Minimum"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("0.750000", "75%"), ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Extended distance", "MaxLodScale", &[
                  ("0.000000", "Off"), ("0.250000", "25%"), ("0.500000", "50%"),
                  ("1.000000", "Maximum"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Long shadows", "Shadow_LongShadows", &[
                  ("false", "Off"), ("true", "On"),
              ]);
              sn512a_graphics_choice(ui, &dir, "Ambient occlusion", "SSAO", &[
                  ("0", "Off"), ("1", "Normal"), ("2", "High"),
              ]);
              sn512a_graphics_choice(ui, &dir, "FXAA", "FXAA_Enabled", &[
                  ("false", "Off"), ("true", "On"),
              ]);
              // MSAA is deliberately absent: GLUE 5's DirectX 10 shader path does not
              // support it. ShaderQuality Normal is also unsafe on this build.
              ui.label("MSAA disabled: unsupported by GLUE 5's DX10 shader path. Shader quality remains at the supported level.");
          }
          
          fn settings_items(
              ui: &mut egui::Ui,''',
                  'graphics menu insertion',
              ),
              (
                  '        SettingsTab::Controls => {',
                  '        SettingsTab::Graphics => sn512a_graphics_menu(ui, settings, status),\n        SettingsTab::Controls => {',
                  'graphics match arm',
              ),
              (
                  '[SettingsTab::Video, SettingsTab::Controls, SettingsTab::Game]',
                  '[SettingsTab::Video, SettingsTab::Graphics, SettingsTab::Controls, SettingsTab::Game]',
                  'settings layout tests',
              ),
          ])
          
          print('SN512A V8.3 pre-launch GRAPHICS menu source patch complete; not compiled or phone-tested.')
          PY_SN512A_GRAPHICS
          python3 -m py_compile /tmp/sn512a_v83_patch.py
          python3 /tmp/sn512a_v83_patch.py .
          git diff --check
          grep -Fq 'fn sn512a_graphics_menu' crates/glue5/src/ui/pages.rs
          grep -Fq 'Graphics,' crates/glue5/src/ui.rs
          git diff --stat
          echo 'V8.3 graphics tab added. Source-only validation; actual compile follows.'
      - name: Retrieve and verify the EXACT uploaded alternate game.wasm from PRIVATE DRAFT
        id: game
        run: |
          set -euo pipefail
          # Experimental: this file is NOT a GLUE 5 supported game build.
          # Exact SHA is from the user's GitHub diagnostic, not guessed.
          EXPECTED_SHA=dcd3dc966ae8ab78637137580da990f9acec2ecfba6c47d153bdc15e4b60ca02
          EXPECTED_BYTES=63202762
          game="$RUNNER_TEMP/game"
          dest="$game/b/8b0b5899ed/game.wasm"
          mkdir -p "$(dirname "$dest")"
          # Select newest PRIVATE DRAFT containing a completed game.wasm upload.
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | jq -r '[.[][] | select(.draft == true) | select(any(.assets[]?; .name == "game.wasm" and .state == "uploaded"))] | sort_by(.created_at) | last | .id // empty')
          test -n "$release" || { echo 'ERROR: No private draft release with uploaded game.wasm.'; exit 1; }
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release" | jq -r '[.assets[] | select(.name == "game.wasm" and .state == "uploaded")] | if length == 1 then .[0].id else empty end')
          test -n "$asset" || { echo 'ERROR: Draft must contain exactly one game.wasm.'; exit 1; }
          curl --fail --show-error --silent --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -o "$dest" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          actual_bytes=$(wc -c < "$dest" | tr -d ' ')
          actual_sha=$(sha256sum "$dest" | cut -d' ' -f1)
          echo "Uploaded file size: $actual_bytes; sha256: $actual_sha"
          if [ "$actual_bytes" != "$EXPECTED_BYTES" ] || [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo 'ERROR: This is not the previously observed alternate game.wasm. No unsafe generic bypass.'
            exit 1
          fi
          python3 - "$dest" <<'PYWASM'
          from pathlib import Path
          import sys
          with open(sys.argv[1], 'rb') as f:
              head = f.read(8)
          if head != b'\x00asm\x01\x00\x00\x00':
              raise SystemExit('Not a valid WebAssembly v1 binary header')
          print('WASM header valid; content still NOT independently GLUE5-compatible.')
          PYWASM
          echo "GLUE5_GAME_DIR=$game" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo 'WARNING: GLUE5_ALLOW_UNKNOWN_BUILD is enabled for this exact SHA only; compatibility and stability are not verified.'
      - name: Make room on runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install official GLUE 5 Android build toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: false
          cache_key_prefix: sn512a-v82-glue5-768
      - name: Install tools from GLUE 5 project config
        run: |
          set -euo pipefail
          mise install rust cmake java gradle android-sdk cargo:cargo-ndk
      - name: Correct optional AdrenoTools packaging on Mali-G57 MC2 (FIX)
        run: |
          set -euo pipefail
          # This phone uses ARM Mali-G57, not Qualcomm Adreno. The upstream
          # Android task may try to package libadrenotools.so even though it
          # never built it. The result is `ln: failed to access ...` AFTER a
          # successful 12-minute Rust compile. Do not invent a fake .so file.
          python3 - <<'PY_SN512A_MALI_PACKAGE'
          from pathlib import Path
          p = Path('.mise/tasks/android/lib.sh')
          if not p.is_file():
              raise SystemExit('Missing GLUE 5 Android packaging task; source layout changed')
          old = p.read_text()
          # Remove ONLY this optional missing library operand from the
          # Android packaging task, leaving libglue5, SDL3, libc++ and Gradle
          # operations unchanged. Do not change the Vulkan rendering code.
          forms = [
              '"target/$target/release/libadrenotools.so"',
              "'target/$target/release/libadrenotools.so'",
              'target/$target/release/libadrenotools.so',
          ]
          target = next((form for form in forms if form in old), None)
          if target is None:
              if 'libadrenotools.so' in old:
                  raise SystemExit('Unknown AdrenoTools packaging form: manual review needed')
              print('Upstream no longer packages AdrenoTools: no fix necessary')
          else:
              # Only remove the source argument, not the shell command or any
              # other required libraries. A bare libadrenotools.so would have
              # been incompatible with the Mali GPU anyway.
              if old.count(target) != 1:
                  raise SystemExit(f'Ambiguous AdrenoTools path: {old.count(target)} matches')
              if 'ln -f' not in old:
                  raise SystemExit('AdrenoTools target found but no expected ln -f copy command')
              new = old.replace(target, '', 1)
              p.write_text(new)
              print('Removed optional unbuilt AdrenoTools library from Android packaging')
          PY_SN512A_MALI_PACKAGE
          bash -n .mise/tasks/android/lib.sh
          git diff --check
          git diff -- .mise/tasks/android/lib.sh
          echo "GLUE 5 upstream commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up release signing key (preserve it for future updates)
        run: |
          set -euo pipefail
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          cd ~/.android
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" get '${{ steps.game.outputs.release }}' Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            mise -C "$GITHUB_WORKSPACE/glue5" exec -- keytool -genkeypair -noprompt \
              -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=SN512A V8 Debug,O=Android,C=US'
          fi
      - name: Compile GLUE 5 Android AOT game and app
        env:
          # Official GLUE 5 build script explicitly permits an unknown build in
          # experimental mode. Hook resolution can fail if code differs.
          GLUE5_ALLOW_UNKNOWN_BUILD: '1'
        run: |
          set -euo pipefail
          mise run android:build
          test -s target/android/gradle/outputs/apk/release/Glue5-release.apk
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk "$RUNNER_TEMP/Glue5-android.apk"
          cp ~/.android/debug.keystore "$RUNNER_TEMP/Glue5-android.keystore"
          sha256sum "$RUNNER_TEMP/Glue5-android.apk"
      - name: Keep signed test APK private in the SAME DRAFT release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/glue5/.github/scripts/draft.sh" upload '${{ steps.game.outputs.release }}' Glue5-android.apk Glue5-android.keystore
          echo 'V8.3 FIX GLUE5 diagnostics + graphics tab build uploaded to your PRIVATE DRAFT RELEASE. Logs: Android/data/local.glue5/files/logs/host.log; last-failure.txt; game-tail.log (if the app reports a failure). No GPU fix has been validated.' >> "$GITHUB_STEP_SUMMARY"
